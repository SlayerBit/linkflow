server:
  port: 8082
  # Kept as 'framework' here, unlike linkflow-app: this service does no IP-based rate limiting or
  # analytics, and it needs the forwarded scheme and host so redirects and absolute links point at
  # the public https origin rather than the internal http one.
  forward-headers-strategy: framework
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        same-site: strict
        http-only: true
        secure: ${SERVER_SERVLET_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: linkflow-web
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:25s}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # Redis is the session store here, so an unauthenticated instance means anyone who can reach
      # it can read or forge logged-in sessions.
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:2s}
  session:
    store-type: redis
    redis:
      namespace: linkflow:web:session
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

linkflow:
  web:
    gateway-url: ${LINKFLOW_GATEWAY_URL:http://127.0.0.1:8080}
    public-gateway-url: ${LINKFLOW_PUBLIC_GATEWAY_URL:http://localhost:8080}
    backend-app-url: ${LINKFLOW_BACKEND_APP_URL:http://127.0.0.1:8081}
    grafana-url: ${LINKFLOW_GRAFANA_URL:http://localhost:3000}
    prometheus-url: ${LINKFLOW_PUBLIC_PROMETHEUS_URL:http://localhost:9090}
    rate-limit:
      user-rpm: ${LINKFLOW_RATE_LIMIT_USER_RPM:100}
      ip-rpm: ${LINKFLOW_RATE_LIMIT_IP_RPM:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        # Redis is the session store: without it nobody can stay signed in, so an instance that
        # cannot reach it should not receive traffic.
        readiness:
          include: readinessState,redis

logging:
  level:
    com.linkflow.web: INFO
