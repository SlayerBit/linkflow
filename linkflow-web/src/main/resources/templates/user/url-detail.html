<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>URL Details — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="mb-2">
            <a th:href="@{/urls}" class="text-muted small text-decoration-none">← Back to Links</a>
        </div>
        <div class="row align-items-end g-3">
            <div class="col">
                <div class="page-pretitle">Link</div>
                <h2 class="page-title lf-mono" th:text="${url.shortCode}">code</h2>
            </div>
            <div class="col-auto d-flex flex-wrap align-items-center gap-2">
                <form th:if="${!url.active && !(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}" th:action="@{/urls/{id}/reactivate(id=${url.id})}" method="post" class="d-inline mb-0"
                      onsubmit="return confirm('Reactivate this URL?');">
                    <button type="submit" class="btn btn-outline-success">Reactivate</button>
                </form>
                <a th:href="@{/urls/{id}/edit(id=${url.id})}" class="btn btn-light">Edit</a>
                <a th:href="@{/urls/{id}/analytics(id=${url.id})}" class="btn btn-primary">Analytics</a>
                <form th:action="@{/urls/{id}/delete(id=${url.id})}" method="post"
                      onsubmit="return confirm('Delete this URL?');" class="d-inline mb-0">
                    <button type="submit" class="btn btn-outline-danger">Delete</button>
                </form>
            </div>
        </div>
    </div>

    <div class="lf-copy-row" th:if="${url.shortUrl != null}">
        <div class="lf-copy-text">
            <div class="lf-copy-kicker">Short URL</div>
            <code class="lf-copy-url" th:id="|short-url-${url.id}|" th:text="${url.shortUrl}" th:title="${url.shortUrl}">short</code>
        </div>
        <button type="button" class="btn copy-btn" th:attr="data-copy-url=${url.shortUrl}" aria-label="Copy short URL">
            <i class="ti ti-copy me-1" aria-hidden="true"></i> Copy
        </button>
    </div>

    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card h-100">
                <div class="card-header"><h3 class="card-title mb-0">Target</h3></div>
                <div class="card-body">
                    <dl class="row mb-0 gy-3">
                        <dt class="col-sm-3 text-muted">Destination</dt>
                        <dd class="col-sm-9 text-truncate mb-0">
                            <a th:href="${url.originalUrl}" th:text="${url.originalUrl}" th:title="${url.originalUrl}" target="_blank" rel="noopener">original</a>
                        </dd>
                        <dt class="col-sm-3 text-muted">Expires</dt>
                        <dd class="col-sm-9 mb-0" th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</dd>
                        <dt class="col-sm-3 text-muted">Created</dt>
                        <dd class="col-sm-9 mb-0" th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm ''UTC''')}">date</dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-header"><h3 class="card-title mb-0">QR</h3></div>
                <div class="card-body text-center">
                    <div class="lf-qr mb-2">
                        <img th:src="@{/urls/{id}/qr-proxy(id=${url.id})}" alt="QR code" class="img-fluid" style="max-width:140px; display: block;">
                    </div>
                    <p class="small text-muted mb-0">PNG from ZXing. Same destination as the short URL.</p>
                </div>
            </div>
        </div>
    </div>

    <dl class="lf-meta">
        <div>
            <dt>Clicks</dt>
            <dd th:text="${analytics.totalClicks}">0</dd>
        </div>
        <div>
            <dt>Last access</dt>
            <dd th:text="${analytics.lastAccessedAt != null ? #temporals.format(analytics.lastAccessedAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</dd>
        </div>
        <div>
            <dt>Status</dt>
            <dd>
                <span th:if="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())}">Expired</span>
                <span th:if="${!(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}"
                      th:text="${url.active} ? 'Active' : 'Inactive'">Active</span>
            </dd>
        </div>
    </dl>
</div>
</body>
</html>
