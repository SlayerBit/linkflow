<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>URL Details — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <div class="row align-items-center">
            <div class="col">
                <div class="mb-1">
                    <a th:href="@{/urls}" class="text-secondary small text-decoration-none">
                        <i class="ti ti-arrow-left me-1"></i> Back to Links
                    </a>
                </div>
                <h2 class="page-title fw-bold text-dark fs-2" th:text="${url.shortCode}">code</h2>
            </div>
            <div class="col-auto d-flex align-items-center gap-2">
                <a th:href="@{/urls/{id}/edit(id=${url.id})}" class="btn btn-outline-primary px-3" style="border-radius: 8px; font-weight: 600;">
                    <i class="ti ti-edit me-1"></i> Edit Link
                </a>
                <a th:href="@{/urls/{id}/analytics(id=${url.id})}" class="btn btn-primary px-3 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                    <i class="ti ti-chart-bar me-1"></i> Full Analytics
                </a>
                <form th:action="@{/urls/{id}/delete(id=${url.id})}" method="post"
                      onsubmit="return confirm('Delete this URL?');" class="d-inline mb-0">
                    <button type="submit" class="btn btn-outline-danger px-3" style="border-radius: 8px; font-weight: 600;">
                        <i class="ti ti-trash me-1"></i> Delete Link
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Row 1: Target Configuration & QR Code -->
    <div class="row row-deck row-cards g-4">
        <div class="col-lg-8">
            <div class="card bg-white h-100">
                <div class="card-header">
                    <h3 class="card-title fw-bold text-dark section-header-title color-cyan mb-0">
                        <i class="ti ti-link"></i> Target Configuration
                    </h3>
                </div>
                <div class="card-body d-flex flex-column justify-content-center">
                    <dl class="row mb-0 gy-3">
                        <dt class="col-sm-3 text-secondary fw-semibold">Short URL</dt>
                        <dd class="col-sm-9 d-flex align-items-center gap-2">
                            <code th:id="|short-url-${url.id}|" th:text="${url.shortUrl}" class="px-2 py-1 bg-light text-primary rounded fw-bold">short</code>
                            <button type="button" class="btn btn-sm btn-light copy-btn"
                                    th:attr="data-copy-url=${url.shortUrl}" style="border-radius: 6px;">
                                <i class="ti ti-copy me-1"></i> Copy
                            </button>
                        </dd>
                        <dt class="col-sm-3 text-secondary fw-semibold">Original URL</dt>
                        <dd class="col-sm-9 text-truncate">
                            <a th:href="${url.originalUrl}" th:text="${url.originalUrl}" target="_blank" class="fw-semibold text-primary text-decoration-none">original</a>
                        </dd>
                        <dt class="col-sm-3 text-secondary fw-semibold">Expiry Date</dt>
                        <dd class="col-sm-9 text-dark" th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</dd>
                        <dt class="col-sm-3 text-secondary fw-semibold">Created Date</dt>
                        <dd class="col-sm-9 text-dark" th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm ''UTC''')}">date</dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card bg-white h-100">
                <div class="card-header">
                    <h3 class="card-title fw-bold text-dark section-header-title color-blue mb-0">
                        <i class="ti ti-qrcode"></i> QR Code Graphic
                    </h3>
                </div>
                <div class="card-body text-center d-flex flex-column align-items-center justify-content-center py-4">
                    <div class="p-2 border rounded bg-white shadow-sm mb-3">
                        <img th:src="@{/urls/{id}/qr-proxy(id=${url.id})}" alt="QR code" class="img-fluid" style="max-width:140px; display: block;">
                    </div>
                    <p class="small text-muted mb-0">Scan or share this code for direct access routing.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Row 2: Metrics Row -->
    <div class="row row-deck row-cards g-4 mt-1">
        <div class="col-md-4">
            <div class="card stat-card card-green bg-white py-3 px-4 h-100">
                <div class="d-flex align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-bold mb-1" style="letter-spacing: 0.05em;">Total Clickthroughs</div>
                        <div class="h2 fw-bold text-dark mb-0" th:text="${analytics.totalClicks}">0</div>
                    </div>
                    <div class="stat-card-icon bg-green-lt ms-auto">
                        <i class="ti ti-mouse-click"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card card-cyan bg-white py-3 px-4 h-100">
                <div class="d-flex align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-bold mb-1" style="letter-spacing: 0.05em;">Last Redirect Access</div>
                        <div class="h3 fw-semibold text-secondary mb-0" th:text="${analytics.lastAccessedAt != null ? #temporals.format(analytics.lastAccessedAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</div>
                    </div>
                    <div class="stat-card-icon bg-cyan-lt ms-auto">
                        <i class="ti ti-clock"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card bg-white py-3 px-4 h-100"
                 th:classappend="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())} ? 'card-amber' : (${url.active} ? 'card-emerald' : 'card-red')">
                <div class="d-flex align-items-center">
                    <div>
                        <div class="text-muted small text-uppercase fw-bold mb-1" style="letter-spacing: 0.05em;">Link Status</div>
                        <div class="h2 fw-bold mb-0">
                            <span th:if="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())}" class="text-warning">Expired</span>
                            <span th:if="${!(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}"
                                  th:class="${url.active} ? 'text-emerald' : 'text-red'"
                                  th:text="${url.active} ? 'Active' : 'Inactive'">Active</span>
                        </div>
                    </div>
                    <div class="stat-card-icon ms-auto"
                         th:classappend="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())} ? 'bg-amber-lt text-warning' : (${url.active} ? 'bg-emerald-lt text-emerald' : 'bg-red-lt text-red')">
                        <i th:class="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())} ? 'ti ti-clock text-warning' : (${url.active} ? 'ti ti-circle-check text-emerald' : 'ti ti-circle-x text-red')"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
