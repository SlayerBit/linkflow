<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>URL Details</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="row align-items-center">
            <div class="col">
                <div class="page-pretitle">Short URL</div>
                <h2 class="page-title" th:text="${url.shortCode}">code</h2>
            </div>
            <div class="col-auto">
                <a th:href="@{/urls/{id}/edit(id=${url.id})}" class="btn btn-outline-primary">Edit</a>
                <a th:href="@{/urls/{id}/analytics(id=${url.id})}" class="btn btn-ghost-primary">Analytics</a>
            </div>
        </div>
    </div>

    <div class="row row-deck row-cards">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-3">Short URL</dt>
                        <dd class="col-sm-9">
                            <code th:id="|short-url-${url.id}|" th:text="${url.shortUrl}">short</code>
                            <button type="button" class="btn btn-sm btn-ghost-primary copy-btn ms-2"
                                    th:attr="data-copy-url=${url.shortUrl}">
                                <i class="ti ti-copy"></i> Copy
                            </button>
                        </dd>
                        <dt class="col-sm-3">Original URL</dt>
                        <dd class="col-sm-9"><a th:href="${url.originalUrl}" th:text="${url.originalUrl}" target="_blank">original</a></dd>
                        <dt class="col-sm-3">Status</dt>
                        <dd class="col-sm-9">
                            <span class="badge" th:classappend="${url.active} ? ' bg-green' : ' bg-red'"
                                  th:text="${url.active} ? 'Active' : 'Inactive'">Active</span>
                        </dd>
                        <dt class="col-sm-3">Expires</dt>
                        <dd class="col-sm-9" th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</dd>
                        <dt class="col-sm-3">Created</dt>
                        <dd class="col-sm-9" th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd HH:mm ''UTC''')}">date</dd>
                    </dl>
                </div>
            </div>

            <div class="card mt-3">
                <div class="card-header"><h3 class="card-title">Analytics summary</h3></div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-sm-6">
                            <div class="subheader">Total clicks</div>
                            <div class="h1" th:text="${analytics.totalClicks}">0</div>
                        </div>
                        <div class="col-sm-6">
                            <div class="subheader">Last accessed</div>
                            <div th:text="${analytics.lastAccessedAt != null ? #temporals.format(analytics.lastAccessedAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'Never'}">Never</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header"><h3 class="card-title">QR Code</h3></div>
                <div class="card-body text-center">
                    <img th:src="@{/urls/{id}/qr-proxy(id=${url.id})}" alt="QR code" class="img-fluid" style="max-width:200px">
                </div>
            </div>
            <form th:action="@{/urls/{id}/delete(id=${url.id})}" method="post" class="mt-3"
                  onsubmit="return confirm('Delete this URL?');">
                <button type="submit" class="btn btn-outline-danger w-100">Delete URL</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
