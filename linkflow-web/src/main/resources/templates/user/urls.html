<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Links — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="row align-items-end">
            <div class="col">
                <div class="page-pretitle">Workspace</div>
                <h2 class="page-title">My Links</h2>
            </div>
            <div class="col-auto d-flex gap-2">
                <a th:href="@{/urls/bulk}" class="btn btn-light">Bulk</a>
                <a th:href="@{/urls/new}" class="btn btn-primary">
                    <i class="ti ti-plus me-1"></i> New Short URL
                </a>
            </div>
        </div>
    </div>

    <div class="card" th:if="${!#lists.isEmpty(urls.content)}">
        <div class="table-responsive">
            <table class="table table-vcenter card-table table-hover table-stack">
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Target</th>
                        <th>Status</th>
                        <th class="col-optional">Expires</th>
                        <th class="col-optional">Created</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="url : ${urls.content}">
                        <td data-label="Code">
                            <div class="d-flex align-items-center gap-2">
                                <a class="lf-shortcode text-decoration-none" th:href="@{/urls/{id}(id=${url.id})}" th:text="${url.shortCode}">code</a>
                                <button type="button" class="btn btn-sm btn-icon btn-light copy-btn"
                                        th:attr="data-copy-url=${url.shortUrl}"
                                        aria-label="Copy short URL">
                                    <i class="ti ti-copy" aria-hidden="true"></i>
                                </button>
                            </div>
                        </td>
                        <td class="text-truncate text-muted" style="max-width:240px" data-label="Target" th:text="${url.originalUrl}" th:title="${url.originalUrl}">original</td>
                        <td data-label="Status">
                            <span th:if="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())}"
                                  class="badge bg-warning-lt">Expired</span>
                            <span th:if="${!(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}"
                                  class="badge" th:classappend="${url.active} ? ' bg-green-lt' : ' bg-red-lt'"
                                  th:text="${url.active} ? 'Active' : 'Inactive'">Active</span>
                        </td>
                        <td class="text-muted col-optional" data-label="Expires" th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                        <td class="text-muted col-optional" data-label="Created" th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd')}">date</td>
                        <td class="text-end table-actions" data-label="Actions">
                            <form th:if="${!url.active && !(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}" th:action="@{/urls/{id}/reactivate(id=${url.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Reactivate this URL?');">
                                <button type="submit" class="btn btn-sm btn-light">Reactivate</button>
                            </form>
                            <a th:href="@{/urls/{id}(id=${url.id})}" class="btn btn-sm btn-light">Open</a>
                            <a th:href="@{/urls/{id}/analytics(id=${url.id})}" class="btn btn-sm btn-light">Analytics</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card empty-state" th:if="${#lists.isEmpty(urls.content)}">
        <div class="empty-state-icon"><i class="ti ti-link"></i></div>
        <div class="empty-state-title">No URLs yet</div>
        <p class="empty-state-description">Create a short link. Alias and expiry are optional.</p>
        <a th:href="@{/urls/new}" class="btn btn-primary">Create URL</a>
    </div>

    <div th:replace="~{fragments/alerts :: pagination(${urls}, '/urls', ${sortBy}, ${direction})}"></div>
</div>
</body>
</html>
