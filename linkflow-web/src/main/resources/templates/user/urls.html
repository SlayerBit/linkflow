<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Links — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <div class="row align-items-center">
            <div class="col">
                <h2 class="page-title fw-bold text-dark fs-2">My Links</h2>
            </div>
            <div class="col-auto">
                <a th:href="@{/urls/new}" class="btn btn-primary px-3 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                    <i class="ti ti-plus me-1"></i> New Short URL
                </a>
            </div>
        </div>
    </div>

    <div class="card bg-white" th:if="${!#lists.isEmpty(urls.content)}">
        <div class="card-header">
            <h3 class="card-title fw-bold text-dark section-header-title color-cyan mb-0">
                <i class="ti ti-link"></i> Shortened Links
            </h3>
        </div>
        <div class="table-responsive">
            <table class="table table-vcenter card-table table-hover table-stack">
                <thead>
                    <tr>
                        <th>Short Code</th>
                        <th>Original Target URL</th>
                        <th>Status</th>
                        <th>Expiry Date</th>
                        <th>Created Date</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="url : ${urls.content}">
                        <td data-label="Short Code">
                            <a class="fw-bold text-primary text-decoration-none" th:href="@{/urls/{id}(id=${url.id})}" th:text="${url.shortCode}">code</a>
                        </td>
                        <td class="text-truncate text-secondary" style="max-width:240px" data-label="Original Target URL" th:text="${url.originalUrl}">original</td>
                        <td data-label="Status">
                            <span th:if="${url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now())}" 
                                  class="badge bg-warning-lt text-warning">Expired</span>
                            <span th:if="${!(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}" 
                                  class="badge" th:classappend="${url.active} ? ' bg-green-lt text-green' : ' bg-red-lt text-red'"
                                  th:text="${url.active} ? 'Active' : 'Inactive'">Active</span>
                        </td>
                        <td class="text-secondary" data-label="Expiry Date" th:text="${url.expiresAt != null ? #temporals.format(url.expiresAt, 'yyyy-MM-dd HH:mm') : '—'}">—</td>
                        <td class="text-secondary" data-label="Created Date" th:text="${#temporals.format(url.createdAt, 'yyyy-MM-dd')}">date</td>
                        <td class="text-end table-actions" data-label="Actions">
                            <form th:if="${!url.active && !(url.expiresAt != null && url.expiresAt.isBefore(T(java.time.Instant).now()))}" th:action="@{/urls/{id}/reactivate(id=${url.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Reactivate this URL?');">
                                <button type="submit" class="btn btn-sm btn-outline-success" style="border-radius: 6px;">Reactivate</button>
                            </form>
                            <a th:href="@{/urls/{id}(id=${url.id})}" class="btn btn-sm btn-light" style="border-radius: 6px;">View</a>
                            <a th:href="@{/urls/{id}/analytics(id=${url.id})}" class="btn btn-sm btn-outline-primary" style="border-radius: 6px;">Analytics</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card bg-white empty-state" th:if="${#lists.isEmpty(urls.content)}">
        <div class="empty-state-icon"><i class="ti ti-link-off"></i></div>
        <div class="empty-state-title">No URLs yet</div>
        <p class="empty-state-description">Generate short redirects to manage your targets easily.</p>
        <a th:href="@{/urls/new}" class="btn btn-primary px-3 shadow-sm" style="border-radius: 8px;">Create URL</a>
    </div>

    <div th:replace="~{fragments/alerts :: pagination(${urls}, '/urls', ${sortBy}, ${direction})}"></div>
</div>
</body>
</html>
