<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>My Profile — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <h2 class="page-title fw-bold text-dark fs-2">My Profile</h2>
    </div>
    
    <div class="row g-4">
        <div class="col-lg-8">
            <div class="card mb-4 bg-white stat-card card-purple">
                <div class="card-body d-flex align-items-center gap-4">
                    <span class="avatar avatar-xl bg-purple-lt rounded-circle"><i class="ti ti-user fs-1"></i></span>
                    <div class="flex-grow-1">
                        <div class="h2 fw-bold text-dark mb-1" th:text="${user.firstName + ' ' + (user.lastName != null ? user.lastName : '')}">John Doe</div>
                        <div class="text-secondary mb-2" th:text="${user.email}">email</div>
                        <div class="d-flex align-items-center gap-2">
                            <span class="text-muted small">Access Level:</span>
                            <span th:each="role : ${user.roles}" class="badge bg-purple-lt text-purple fw-bold" th:text="${role}">USER</span>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light py-2 px-4 border-top" style="font-size: 0.8rem; color: #64748b;">
                    <i class="ti ti-calendar me-1"></i> Member since <span class="fw-semibold" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">date</span>
                </div>
            </div>
            
            <div class="card bg-white">
                <div class="card-header">
                    <h3 class="card-title fw-bold text-dark section-header-title color-purple mb-0">
                        <i class="ti ti-settings"></i> Update Profile Details
                    </h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/profile}" th:object="${updateProfileForm}" method="post">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="font-weight: 500;">First name</label>
                                <input type="text" class="form-control" th:field="*{firstName}" required style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                                <div class="text-danger small mt-1" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" style="font-weight: 500;">Last name</label>
                                <input type="text" class="form-control" th:field="*{lastName}" style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary px-4 py-2 mt-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
