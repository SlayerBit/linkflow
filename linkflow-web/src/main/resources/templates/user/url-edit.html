<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Edit URL</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="page-pretitle"><a th:href="@{/urls}">My URLs</a></div>
        <h2 class="page-title">Edit — <span th:text="${url.shortCode}">code</span></h2>
    </div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <form th:action="@{/urls/{id}/edit(id=${url.id})}" th:object="${updateUrlForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label">Expires at (UTC)</label>
                            <input type="datetime-local" class="form-control" th:field="*{expiresAt}">
                            <div class="form-hint">Leave blank to keep current expiry unchanged.</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" th:field="*{active}">
                                <span class="form-check-label">Active</span>
                            </label>
                        </div>
                        <button type="submit" class="btn btn-primary">Save changes</button>
                        <a th:href="@{/urls/{id}(id=${url.id})}" class="btn btn-link">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
