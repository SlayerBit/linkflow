<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Edit URL</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="mb-2">
            <a th:href="@{/urls/{id}(id=${url.id})}" class="text-muted small text-decoration-none">← Back to Details</a>
        </div>
        <h2 class="page-title">Edit — <span class="lf-mono" th:text="${url.shortCode}">code</span></h2>
    </div>
    <div class="lf-create-panel">
        <form th:action="@{/urls/{id}/edit(id=${url.id})}" th:object="${updateUrlForm}" method="post">
            <div class="mb-3">
                <label class="form-label" for="expiresAt">Expires (UTC)</label>
                <input type="datetime-local" class="form-control" th:field="*{expiresAt}" aria-describedby="expiresAt-hint">
                <div class="form-hint" id="expiresAt-hint">Leave blank to keep the current expiry.</div>
            </div>
            <div class="mb-4">
                <label class="form-check form-switch mb-0">
                    <input class="form-check-input" type="checkbox" th:field="*{active}">
                    <span class="form-check-label">Active</span>
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/urls/{id}(id=${url.id})}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
