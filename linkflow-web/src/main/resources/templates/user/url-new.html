<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Create URL</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <div class="mb-1">
            <a th:href="@{/urls}" class="text-secondary small text-decoration-none">
                <i class="ti ti-arrow-left me-1"></i> Back to Links
            </a>
        </div>
        <h2 class="page-title fw-bold text-dark fs-2">Create Short URL</h2>
    </div>
    <div class="row">
        <div class="col-lg-8">
            <div class="card bg-white">
                <div class="card-header">
                    <h3 class="card-title fw-bold text-dark section-header-title color-purple mb-0">
                        <i class="ti ti-plus"></i> Shorten a New Link
                    </h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/urls/new}" th:object="${createUrlForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label required fw-semibold text-secondary">Original Target URL</label>
                            <input type="url" class="form-control" th:field="*{originalUrl}" placeholder="https://example.com/page" style="border-radius: 8px;" required>
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('originalUrl')}" th:errors="*{originalUrl}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Custom Alias (Optional)</label>
                            <input type="text" class="form-control" th:field="*{customAlias}" placeholder="my-link" style="border-radius: 8px;">
                            <div class="text-danger small mt-1" th:if="${#fields.hasErrors('customAlias')}" th:errors="*{customAlias}"></div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary">Expires At (Optional, UTC)</label>
                            <input type="datetime-local" class="form-control" th:field="*{expiresAt}" style="border-radius: 8px;">
                        </div>
                        <button type="submit" class="btn btn-primary px-3" style="border-radius: 8px; font-weight: 600;">Create Link</button>
                        <a th:href="@{/urls}" class="btn btn-link text-secondary text-decoration-none ms-2">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
