<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Create URL</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="mb-2">
            <a th:href="@{/urls}" class="text-muted small text-decoration-none">← Back to Links</a>
        </div>
        <h2 class="page-title">Create Short URL</h2>
        <p class="text-muted mb-0">Paste a destination. Everything else is optional.</p>
    </div>
    <div class="lf-create-panel">
        <form th:action="@{/urls/new}" th:object="${createUrlForm}" method="post">
            <div class="mb-3">
                <label class="form-label required" for="originalUrl">Destination</label>
                <input type="url" class="form-control form-control-lg" th:field="*{originalUrl}" placeholder="https://example.com/page" required autofocus>
                <div class="field-error" id="originalUrl-error" data-field="originalUrl" th:if="${#fields.hasErrors('originalUrl')}" th:errors="*{originalUrl}"></div>
            </div>
            <details class="lf-disclosure mb-4" th:open="${#fields.hasErrors('customAlias') or #fields.hasErrors('expiresAt')}">
                <summary>Alias and expiry</summary>
                <div class="pt-3">
                    <div class="mb-3">
                        <label class="form-label" for="customAlias">Custom alias</label>
                        <input type="text" class="form-control" th:field="*{customAlias}" placeholder="docs" autocomplete="off">
                        <div class="form-hint">Leave blank to generate a short code.</div>
                        <div class="field-error" id="customAlias-error" data-field="customAlias" th:if="${#fields.hasErrors('customAlias')}" th:errors="*{customAlias}"></div>
                    </div>
                    <div class="mb-0">
                        <label class="form-label" for="expiresAt">Expires (UTC)</label>
                        <input type="datetime-local" class="form-control" th:field="*{expiresAt}">
                    </div>
                </div>
            </details>
            <button type="submit" class="btn btn-primary">Create link</button>
            <a th:href="@{/urls}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
