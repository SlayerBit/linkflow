<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Link Analytics — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="page-pretitle">
            <a th:href="@{/urls/{id}(id=${url.id})}" th:text="${url.shortCode}" class="text-muted text-decoration-none">code</a>
        </div>
        <h2 class="page-title">Analytics</h2>
        <p class="text-muted mb-0">Counts and daily trends from flushed click events. IPs in the activity feed are masked.</p>
    </div>

    <div class="lf-metric mb-4">
        <div class="metric-label">Total clicks</div>
        <div class="metric-value lf-metric-hero mt-2" th:text="${analytics.totalClicks}">0</div>
        <div class="metric-subtext">
            Last accessed
            <span th:text="${analytics.lastAccessedAt != null ? #temporals.format(analytics.lastAccessedAt, 'yyyy-MM-dd HH:mm ''UTC''') : 'never'}">never</span>
            · counts and daily trends from flushed events
        </div>
    </div>

    <div class="card">
        <div class="card-header d-flex align-items-center flex-wrap gap-2">
            <h3 class="card-title mb-0">Click trend</h3>
            <div class="ms-auto segmented-control" role="group" aria-label="Trend range">
                <button type="button" class="btn-segmented btn-trend-range" id="btn-trend-7">7D</button>
                <button type="button" class="btn-segmented btn-trend-range" id="btn-trend-30">30D</button>
                <button type="button" class="btn-segmented btn-trend-range" id="btn-trend-90">90D</button>
            </div>
        </div>
        <div class="card-body">
            <div class="chart-container chart-trend">
                <div class="skeleton skeleton-chart-lg" data-chart-skeleton aria-hidden="true"></div>
                <canvas id="clickTrendChart" data-chart-canvas hidden></canvas>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script th:src="@{/vendor/chartjs/chart.umd.min.js}"></script>
    <script th:inline="javascript" th:attr="nonce=${cspNonce}">
        const trends = {
            7: /*[[${trend7dJson}]]*/ '[]',
            30: /*[[${trend30dJson}]]*/ '[]',
            90: /*[[${trend90dJson}]]*/ '[]'
        };

        const data7d = JSON.parse(trends[7]);
        const data30d = JSON.parse(trends[30]);
        const data90d = JSON.parse(trends[90]);

        function getPaddedData(trendData, days) {
            const labels = [];
            const dataMap = {};
            for (let i = days - 1; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                labels.push(dateStr);
                dataMap[dateStr] = 0;
            }
            trendData.forEach(item => {
                if (dataMap[item.date] !== undefined) {
                    dataMap[item.date] = item.clicks;
                }
            });
            return { labels, dataPoints: labels.map(l => dataMap[l]) };
        }

        let currentChart = null;

        function renderChart(days) {
            let rawData;
            if (days === 7) rawData = data7d;
            else if (days === 90) rawData = data90d;
            else rawData = data30d;

            const { labels, dataPoints } = getPaddedData(rawData, days);
            if (currentChart) currentChart.destroy();

            const t = lfTheme();
            const ctx = document.getElementById('clickTrendChart').getContext('2d');
            const fill = ctx.createLinearGradient(0, 0, 0, 300);
            fill.addColorStop(0, 'rgba(194, 78, 28, 0.18)');
            fill.addColorStop(1, 'rgba(194, 78, 28, 0)');

            currentChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Clicks',
                        data: dataPoints,
                        borderColor: t.signal,
                        backgroundColor: fill,
                        fill: true,
                        tension: 0.25,
                        borderWidth: 2,
                        pointRadius: days > 30 ? 0 : 3,
                        pointHoverRadius: 5,
                        pointBackgroundColor: t.signal,
                        pointBorderColor: '#fbfaf6',
                        pointBorderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { display: false },
                        tooltip: Object.assign(lfTooltip(), {
                            callbacks: { label: function (c) { return c.raw + ' clicks'; } }
                        })
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { color: t.muted, maxTicksLimit: 8 }
                        },
                        y: {
                            beginAtZero: true,
                            grid: { color: t.line, drawTicks: false },
                            ticks: { precision: 0, color: t.muted }
                        }
                    }
                }
            });

            document.querySelectorAll('.btn-trend-range').forEach(btn => btn.classList.remove('active', 'btn-primary'));
            const activeBtn = document.getElementById('btn-trend-' + days);
            if (activeBtn) activeBtn.classList.add('active');
        }

        document.getElementById('btn-trend-7').addEventListener('click', function () { renderChart(7); });
        document.getElementById('btn-trend-30').addEventListener('click', function () { renderChart(30); });
        document.getElementById('btn-trend-90').addEventListener('click', function () { renderChart(90); });
        document.addEventListener('DOMContentLoaded', function () { renderChart(30); });
    </script>
</th:block>
</body>
</html>
