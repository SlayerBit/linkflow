<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Bulk Create URLs — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <div class="mb-1">
            <a th:href="@{/urls}" class="text-secondary small text-decoration-none">
                <i class="ti ti-arrow-left me-1"></i> Back to Links
            </a>
        </div>
        <h2 class="page-title">Bulk Create Short URLs</h2>
        <p class="text-muted mb-0">One destination per line. Codes are generated. Maximum 100.</p>
    </div>

    <div class="lf-create-panel lf-create-panel-wide">
        <form th:action="@{/urls/bulk}" th:object="${bulkCreateUrlForm}" method="post">
            <div class="mb-3">
                <label class="form-label required" for="urlsText">URLs</label>
                <textarea class="form-control" th:field="*{urlsText}" rows="12"
                          placeholder="https://example.com/page1&#10;https://example.com/page2"
                          required aria-describedby="urlsText-hint"></textarea>
                <div class="field-error" id="urlsText-error" data-field="urlsText" th:if="${#fields.hasErrors('urlsText')}" th:errors="*{urlsText}"></div>
                <small class="form-hint" id="urlsText-hint">http:// or https://. Blank lines are skipped.</small>
            </div>
            <button type="submit" class="btn btn-primary">Shorten all</button>
            <a th:href="@{/urls}" class="btn btn-link text-muted text-decoration-none">Cancel</a>
        </form>
    </div>

    <!--/* Results Table */-->
    <div th:if="${results != null and !results.isEmpty()}" class="mt-4">
        <div class="card bg-white">
            <div class="card-header py-3">
                <h3 class="card-title fw-bold text-dark section-header-title color-green mb-0">
                    <i class="ti ti-circle-check"></i> Created URLs
                </h3>
            </div>
            <div class="table-responsive">
                <table class="table table-vcenter card-table">
                    <thead>
                    <tr>
                        <th class="fw-bold text-secondary">#</th>
                        <th class="fw-bold text-secondary">Short URL</th>
                        <th class="fw-bold text-secondary">Original URL</th>
                        <th class="fw-bold text-secondary">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="url, iter : ${results}">
                        <td th:text="${iter.count}">1</td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <code class="lf-shortcode" th:text="${url.shortUrl()}">short</code>
                                <button type="button" class="btn btn-sm btn-icon btn-light copy-btn"
                                        th:attr="data-copy-url=${url.shortUrl()}"
                                        aria-label="Copy short URL">
                                    <i class="ti ti-copy" aria-hidden="true"></i>
                                </button>
                            </div>
                        </td>
                        <td>
                            <span class="text-muted text-truncate d-inline-block" style="max-width: 400px;" th:text="${url.originalUrl()}" th:title="${url.originalUrl()}">original</span>
                        </td>
                        <td>
                            <a th:href="@{'/urls/' + ${url.id()}}" class="btn btn-sm btn-light">Open</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
