<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="alerts" class="lf-flash" aria-live="polite" aria-atomic="true">
    <div class="alert alert-success alert-premium alert-dismissible d-flex align-items-center" role="status"
         th:if="${successMessage}">
        <i class="ti ti-circle-check fs-2 me-2" aria-hidden="true"></i>
        <div th:text="${successMessage}">Success</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
    <div class="alert alert-info alert-premium alert-dismissible d-flex align-items-center" role="status"
         th:if="${infoMessage}">
        <i class="ti ti-info-circle fs-2 me-2" aria-hidden="true"></i>
        <div th:text="${infoMessage}">Info</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
    <div class="alert alert-danger alert-premium alert-dismissible d-flex align-items-center" role="alert"
         th:if="${errorMessage}">
        <i class="ti ti-alert-circle fs-2 me-2" aria-hidden="true"></i>
        <div th:text="${errorMessage}">Error</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
    <div class="alert alert-warning alert-premium alert-dismissible d-flex align-items-center" role="alert"
         th:if="${param.error != null and param.error[0] == 'access_denied'}">
        <i class="ti ti-alert-triangle fs-2 me-2" aria-hidden="true"></i>
        <div>You do not have permission to access that page.</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
    <div class="alert alert-danger alert-premium alert-dismissible d-flex align-items-center" role="alert"
         th:if="${param.error != null and param.error[0] != 'access_denied'}">
        <i class="ti ti-alert-circle fs-2 me-2" aria-hidden="true"></i>
        <div th:text="${param.error[0]}">Error</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Dismiss"></button>
    </div>
</div>

<nav th:fragment="pagination(page, baseUrl, sortBy, direction)" class="lf-pagination" aria-label="Pagination"
     th:if="${page != null}">
    <div class="text-secondary small fw-medium">
        Page <span class="text-dark fw-bold" th:text="${page.page + 1}">1</span> of
        <span class="text-dark fw-bold" th:text="${page.totalPages == 0 ? 1 : page.totalPages}">1</span>
        (<span class="fw-semibold" th:text="${page.totalElements}">0</span> total)
    </div>
    <ul class="pagination m-0" th:if="${page.totalPages > 1}">
        <li class="page-item" th:classappend="${page.page == 0} ? ' disabled'">
            <a class="page-link" th:if="${page.page > 0}"
               th:href="@{${baseUrl}(page=${page.page - 1}, sortBy=${sortBy}, direction=${direction})}">Previous</a>
            <span class="page-link" th:if="${page.page == 0}">Previous</span>
        </li>
        <li class="page-item" th:each="p : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${p == page.page} ? ' active'">
            <a class="page-link" th:href="@{${baseUrl}(page=${p}, sortBy=${sortBy}, direction=${direction})}"
               th:text="${p + 1}" th:aria-current="${p == page.page} ? 'page'">1</a>
        </li>
        <li class="page-item" th:classappend="${page.page >= page.totalPages - 1} ? ' disabled'">
            <a class="page-link" th:if="${page.page < page.totalPages - 1}"
               th:href="@{${baseUrl}(page=${page.page + 1}, sortBy=${sortBy}, direction=${direction})}">Next</a>
            <span class="page-link" th:if="${page.page >= page.totalPages - 1}">Next</span>
        </li>
    </ul>
</nav>
</body>
</html>
