<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>System Health</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none"><h2 class="page-title">System Health</h2></div>

    <div class="row row-deck row-cards mb-4">
        <div class="col-sm-6 col-lg-3">
            <div class="card">
                <div class="card-body">
                    <div class="subheader">Status</div>
                    <span class="badge fs-4" th:classappend="${health.get('status').asText() == 'UP'} ? ' bg-green' : ' bg-red'"
                          th:text="${health.get('status').asText()}">UP</span>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3" th:if="${health.has('components') and health.get('components').has('db')}">
            <div class="card">
                <div class="card-body">
                    <div class="subheader">Database</div>
                    <span class="badge" th:classappend="${health.get('components').get('db').get('status').asText() == 'UP'} ? ' bg-green' : ' bg-red'"
                          th:text="${health.get('components').get('db').get('status').asText()}">UP</span>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-lg-3" th:if="${health.has('components') and health.get('components').has('redis')}">
            <div class="card">
                <div class="card-body">
                    <div class="subheader">Redis</div>
                    <span class="badge" th:classappend="${health.get('components').get('redis').get('status').asText() == 'UP'} ? ' bg-green' : ' bg-red'"
                          th:text="${health.get('components').get('redis').get('status').asText()}">UP</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-header"><h3 class="card-title">Observability</h3></div>
        <div class="card-body">
            <a th:href="${grafanaUrl}" target="_blank" class="btn btn-outline-primary me-2">Open Grafana</a>
            <a th:href="${prometheusUrl}" target="_blank" class="btn btn-outline-primary">Open Prometheus</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header"><h3 class="card-title">Health details</h3></div>
        <div class="card-body"><pre class="mb-0 health-pre" th:text="${health.toPrettyString()}">{}</pre></div>
    </div>
</div>
</body>
</html>
