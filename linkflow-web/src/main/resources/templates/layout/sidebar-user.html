<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="userNav">
    <li class="nav-item">
        <a class="nav-link" th:href="@{/dashboard}" th:classappend="${activeNav == 'dashboard'} ? ' active'">
            <span class="nav-link-icon"><i class="ti ti-layout-dashboard"></i></span>
            <span class="nav-link-title">Overview</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/urls}" th:classappend="${activeNav == 'urls'} ? ' active'">
            <span class="nav-link-icon"><i class="ti ti-link"></i></span>
            <span class="nav-link-title">Links</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/urls/bulk}" th:classappend="${activeNav == 'urls-bulk'} ? ' active'">
            <span class="nav-link-icon"><i class="ti ti-list"></i></span>
            <span class="nav-link-title">Bulk create</span>
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/profile}" th:classappend="${activeNav == 'profile'} ? ' active'">
            <span class="nav-link-icon"><i class="ti ti-user"></i></span>
            <span class="nav-link-title">Profile</span>
        </a>
    </li>
    <li class="nav-item">
        <span class="nav-link disabled nav-section-label">Lab</span>
    </li>
    <li class="nav-item">
        <a class="nav-link" th:href="@{/tools/rate-limit}" th:classappend="${activeNav == 'tools-rate-limit'} ? ' active'">
            <span class="nav-link-icon"><i class="ti ti-gauge"></i></span>
            <span class="nav-link-title">Rate limit</span>
        </a>
    </li>
</th:block>
</body>
</html>
