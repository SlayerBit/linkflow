<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle != null ? pageTitle + ' — LinkFlow' : 'LinkFlow'}">LinkFlow</title>
    <meta name="description" content="LinkFlow is URL infrastructure: cache-aside redirects, sliding-window rate limits, and click analytics that never block the 302.">
    <meta name="_csrf" th:content="${_csrf.token}" th:if="${_csrf}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}" th:if="${_csrf}"/>
    <link rel="stylesheet" th:href="@{/vendor/tabler/tabler.min.css}">
    <link rel="stylesheet" th:href="@{/vendor/tabler-icons/tabler-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
    <link rel="stylesheet" th:href="@{/css/marketing.css}">
    <th:block layout:fragment="head"></th:block>
</head>
<body th:classappend="|${auth != null ? 'lf-app' : 'lf-public'}${fullBleed == true ? ' lf-landing-page' : ''}|">
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="page">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark" th:if="${auth != null}">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu"
                    aria-controls="sidebar-menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <h1 class="navbar-brand navbar-brand-autodark mb-0">
                <th:block th:replace="~{layout/brand :: logo(@{/dashboard})}"></th:block>
            </h1>
            <div class="collapse navbar-collapse" id="sidebar-menu">
                <ul class="navbar-nav pt-lg-2">
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <span class="nav-link disabled nav-section-label">Admin</span>
                    </li>
                    <th:block sec:authorize="hasRole('ADMIN')" th:replace="~{layout/sidebar-admin :: adminNav}"></th:block>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <span class="nav-link disabled nav-section-label">Workspace</span>
                    </li>
                    <th:block th:replace="~{layout/sidebar-user :: userNav}"></th:block>
                </ul>
                <div class="lf-sidebar-account d-lg-none">
                    <div class="lf-userchip-name" th:text="${auth.displayName()}">User</div>
                    <div class="small mb-2" th:text="${auth.email()}">email</div>
                    <a th:href="@{/profile}">Profile</a>
                    <span class="mx-2" aria-hidden="true">·</span>
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button type="submit">Sign out</button>
                    </form>
                </div>
            </div>
        </div>
    </aside>

    <div class="page-wrapper" th:if="${auth != null}">
        <header class="navbar navbar-expand-md d-none d-lg-flex d-print-none lf-topbar">
            <div class="container-xl">
                <div class="navbar-nav flex-row order-md-last ms-auto">
                    <div class="nav-item dropdown">
                        <a class="nav-link lf-userchip p-0" href="#" data-bs-toggle="dropdown"
                           aria-label="Open user menu" aria-haspopup="true">
                            <span class="lf-avatar" aria-hidden="true"><i class="ti ti-user"></i></span>
                            <div class="d-none d-xl-block">
                                <div class="lf-userchip-name" th:text="${auth.displayName()}">User</div>
                                <div class="small text-muted" th:text="${auth.email()}">email</div>
                            </div>
                        </a>
                        <div class="dropdown-menu dropdown-menu-end">
                            <a class="dropdown-item" th:href="@{/profile}">Profile</a>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">Sign out</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </header>
        <div class="page-body">
            <div class="container-xl">
                <div th:replace="~{fragments/alerts :: alerts}"></div>
                <main id="main-content" tabindex="-1">
                    <div layout:fragment="content"></div>
                </main>
            </div>
        </div>
        <footer class="footer footer-transparent d-print-none py-3 mt-auto lf-footer">
            <div class="container-xl">
                <span>LinkFlow</span>
                <span class="mx-2" aria-hidden="true">·</span>
                <a href="https://github.com/SlayerBit/linkflow" class="link-secondary" target="_blank" rel="noopener">GitHub</a>
            </div>
        </footer>
    </div>

    <th:block th:if="${auth == null}" th:replace="~{layout/public-nav :: publicNav}"></th:block>

    <div class="page-body" th:if="${auth == null}" th:classappend="${fullBleed == true} ? ' page-body-flush'">
        <div th:class="${fullBleed == true} ? 'container-fluid px-0' : 'container-xl'">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <main id="main-content" tabindex="-1">
                <div layout:fragment="content"></div>
            </main>
        </div>
    </div>
</div>

<script th:src="@{/vendor/tabler/tabler.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<div id="lf-live" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
