<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div class="lf-auth-panel" th:fragment="panel(title, copy)">
    <div>
        <th:block th:replace="~{layout/brand :: logo(@{/})}"></th:block>
        <h2 th:text="${title}">Title</h2>
        <p th:text="${copy}">Copy</p>
    </div>
    <div class="lf-auth-motif" aria-hidden="true">
        <svg viewBox="0 0 320 200" width="100%" preserveAspectRatio="xMidYMid meet">
            <defs>
                <linearGradient id="ap-glow" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#c24e1c" stop-opacity="0.4"/>
                    <stop offset="100%" stop-color="#c24e1c" stop-opacity="0"/>
                </linearGradient>
            </defs>
            <circle cx="160" cy="100" r="80" fill="url(#ap-glow)" opacity="0.3"/>
            <!-- Flowing connection lines -->
            <path class="lf-auth-wire lf-auth-wire-1" d="M40 100 Q100 50, 160 100 Q220 150, 280 100" fill="none" stroke="rgba(244,240,232,0.15)" stroke-width="1.5"/>
            <path class="lf-auth-wire lf-auth-wire-2" d="M30 130 Q90 80, 150 130 Q210 180, 270 130" fill="none" stroke="rgba(244,240,232,0.08)" stroke-width="1"/>
            <path class="lf-auth-wire lf-auth-wire-3" d="M50 70 Q110 20, 170 70 Q230 120, 290 70" fill="none" stroke="rgba(244,240,232,0.08)" stroke-width="1"/>
            <!-- Animated signal -->
            <path class="lf-auth-signal" d="M40 100 Q100 50, 160 100 Q220 150, 280 100" fill="none" stroke="#c24e1c" stroke-width="1.5" stroke-dasharray="4 16" opacity="0.55"/>
            <!-- Nodes -->
            <circle cx="40" cy="100" r="6" fill="#1f2128" stroke="rgba(244,240,232,0.2)" stroke-width="1.5"/>
            <circle cx="40" cy="100" r="2.8" fill="#c24e1c"/>
            <circle cx="280" cy="100" r="6" fill="#1f2128" stroke="rgba(244,240,232,0.2)" stroke-width="1.5"/>
            <circle cx="280" cy="100" r="2.8" fill="#c24e1c"/>
            <circle cx="160" cy="100" r="4" fill="#1f2128" stroke="rgba(244,240,232,0.12)" stroke-width="1"/>
            <circle cx="160" cy="100" r="1.8" fill="rgba(244,240,232,0.4)"/>
            <!-- Subtle dot grid -->
            <g opacity="0.08">
                <circle cx="80" cy="40" r="1" fill="#f4f0e8"/>
                <circle cx="120" cy="40" r="1" fill="#f4f0e8"/>
                <circle cx="200" cy="40" r="1" fill="#f4f0e8"/>
                <circle cx="240" cy="40" r="1" fill="#f4f0e8"/>
                <circle cx="80" cy="160" r="1" fill="#f4f0e8"/>
                <circle cx="120" cy="160" r="1" fill="#f4f0e8"/>
                <circle cx="200" cy="160" r="1" fill="#f4f0e8"/>
                <circle cx="240" cy="160" r="1" fill="#f4f0e8"/>
            </g>
        </svg>
    </div>
</div>
</body>
</html>
