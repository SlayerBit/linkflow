<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Create Account — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth">
        <th:block th:replace="~{layout/auth-panel :: panel('Issue a code. Own the redirect.', 'One account. A Redis session. A workspace that already knows how the 302 is served.')}"></th:block>
        <div class="lf-auth-form">
            <div class="lf-auth-form-inner">
                <h1>Create account</h1>
                <p class="text-muted mb-4">Activation is emailed. The link lasts 24 hours.</p>

                <div class="alert alert-danger alert-premium mb-3" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>

                <form th:action="@{/register}" th:object="${registerForm}" method="post">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="firstName">First name</label>
                            <input type="text" class="form-control" th:field="*{firstName}" required autocomplete="given-name">
                            <div class="field-error" id="firstName-error" data-field="firstName" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label" for="lastName">Last name</label>
                            <input type="text" class="form-control" th:field="*{lastName}" autocomplete="family-name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input type="email" class="form-control" th:field="*{email}" required autocomplete="email">
                        <div class="field-error" id="email-error" data-field="email" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-control" th:field="*{password}" required autocomplete="new-password" aria-describedby="password-hint">
                        <div class="form-hint" id="password-hint">Uppercase, lowercase, number, and a special character.</div>
                        <div class="field-error" id="password-error" data-field="password" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Create account</button>
                </form>

                <p class="text-muted mt-4 mb-0">
                    Already registered? <a th:href="@{/login}" class="fw-semibold">Sign in</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
