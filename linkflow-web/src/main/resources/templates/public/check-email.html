<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Check your email — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth-narrow">
        <h1 class="page-title mb-2">Check your email</h1>
        <p class="text-muted mb-1">We sent an activation link to</p>
        <p class="fw-semibold mb-4" th:text="${email}">you@example.com</p>
        <p class="text-muted small mb-4">
            Open the link to finish setting up your account. It expires in 24 hours.
            If it hasn't arrived in a few minutes, check your spam folder.
        </p>
        <form th:action="@{/resend-verification}" method="post">
            <input type="hidden" name="email" th:value="${email}">
            <button type="submit" class="btn btn-outline-primary w-100">Resend the link</button>
        </form>
        <p class="mt-4 mb-0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</div>
</body>
</html>
