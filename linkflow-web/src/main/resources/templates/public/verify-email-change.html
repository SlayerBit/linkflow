<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Verify Email Change — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-xl-5 col-lg-7">
            <div class="card overflow-hidden" style="border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); border-radius: 16px;">
                <div class="card-body p-5 bg-white">

                    <div class="text-center mb-4">
                        <span class="avatar avatar-xl rounded-circle mb-3"
                              th:classappend="${successMessage != null} ? 'bg-green-lt' : 'bg-purple-lt'"
                              style="width: 5rem; height: 5rem; font-size: 2.25rem;">
                            <i th:class="${successMessage != null} ? 'ti ti-circle-check' : 'ti ti-mail-check'"></i>
                        </span>
                        <h2 class="fw-bold text-dark mb-1"
                            th:text="${successMessage != null} ? 'Email updated' : 'Confirm email change'">Confirm email change</h2>
                    </div>

                    <div class="alert alert-success alert-premium d-flex align-items-start mb-4" th:if="${successMessage}">
                        <i class="ti ti-circle-check fs-2 me-2 mt-1"></i>
                        <div th:text="${successMessage}">Success</div>
                    </div>
                    <div class="alert alert-danger alert-premium d-flex align-items-start mb-4" th:if="${errorMessage}">
                        <i class="ti ti-alert-circle fs-2 me-2 mt-1"></i>
                        <div th:text="${errorMessage}">Error</div>
                    </div>

                    <div th:if="${successMessage != null}" class="text-center mt-3">
                        <a th:href="@{/login}" class="btn btn-primary px-4 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                            Sign in
                        </a>
                    </div>

                    <p class="text-center text-muted mt-4 mb-0" th:if="${successMessage == null}">
                        <a th:href="@{/profile}" class="fw-semibold text-decoration-none">Back to profile</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
