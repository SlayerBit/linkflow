<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Verify Email Change — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth-narrow">
        <h1 class="page-title mb-3"
            th:text="${successMessage != null} ? 'Email updated' : 'Confirm email change'">Confirm email change</h1>

        <div th:if="${successMessage != null}">
            <a th:href="@{/login}" class="btn btn-primary">Sign in</a>
        </div>
        <p class="mt-4 mb-0" th:if="${successMessage == null}">
            <a th:href="@{/profile}">Back to profile</a>
        </p>
    </div>
</div>
</body>
</html>
