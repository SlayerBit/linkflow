<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Verify Email — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-xl-5 col-lg-7">
            <div class="card overflow-hidden" style="border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); border-radius: 16px;">
                <div class="card-body p-5 bg-white">

                    <!--/*
                      Only `verified` switches this page into its confirmed state. An acknowledgement
                      from the resend flow arrives as `infoMessage`, which must not be mistaken for
                      the account actually being activated.
                    */-->
                    <div class="text-center mb-4">
                        <span class="avatar avatar-xl rounded-circle mb-3"
                              th:classappend="${verified} ? 'bg-green-lt' : 'bg-blue-lt'"
                              style="width: 5rem; height: 5rem; font-size: 2.25rem;">
                            <i th:class="${verified} ? 'ti ti-circle-check' : 'ti ti-mail-check'"></i>
                        </span>
                        <h2 class="fw-bold text-dark mb-1" th:text="${verified} ? 'Email confirmed' : 'Verify your email'">Verify your email</h2>
                        <p class="text-muted mb-0" th:text="${verified}
                                ? 'Your account is active. You can sign in now.'
                                : 'Open the link we sent you to activate your account.'">
                            Open the link we sent you to activate your account.
                        </p>
                    </div>

                    <div class="alert alert-info alert-premium d-flex align-items-center mb-4" role="status" th:if="${infoMessage}">
                        <i class="ti ti-send fs-2 me-2"></i>
                        <div th:text="${infoMessage}">Sent</div>
                    </div>
                    <div class="alert alert-danger alert-premium d-flex align-items-center mb-4" role="alert" th:if="${errorMessage}">
                        <i class="ti ti-alert-circle fs-2 me-2"></i>
                        <div th:text="${errorMessage}">Error</div>
                    </div>

                    <div th:if="${verified}" class="text-center mt-3">
                        <a th:href="@{/login}" class="btn btn-primary px-4 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                            Sign in
                        </a>
                    </div>

                    <!--/*
                      Offered whenever the account is not yet confirmed: after a failed or expired
                      link, when the page is reached without a link at all, and after a previous
                      resend so a mistyped address can be corrected.
                    */-->
                    <form th:action="@{/resend-verification}" method="post" th:unless="${verified}">
                        <div class="mb-3">
                            <label class="form-label" for="verify-email-address" style="font-weight: 500;">Email address</label>
                            <input type="email" class="form-control" id="verify-email-address" name="email" th:value="${email}"
                                   placeholder="name@example.com" required autocomplete="email"
                                   style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                            <div class="form-hint">We'll send a new activation link, valid for 24 hours.</div>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                            Send a new link
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none">Back to sign in</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
