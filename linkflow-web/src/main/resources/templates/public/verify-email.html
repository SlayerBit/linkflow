<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Verify Email — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth-narrow">
        <h1 class="page-title mb-2" th:text="${verified} ? 'Email confirmed' : 'Verify your email'">Verify your email</h1>
        <p class="text-muted mb-4" th:text="${verified}
                ? 'Your account is active. You can sign in now.'
                : 'Open the link we sent you to activate your account.'">
            Open the link we sent you to activate your account.
        </p>

        <div th:if="${verified}">
            <a th:href="@{/login}" class="btn btn-primary">Sign in</a>
        </div>

        <form th:action="@{/resend-verification}" method="post" th:unless="${verified}">
            <div class="mb-3">
                <label class="form-label" for="verify-email-address">Email address</label>
                <input type="email" class="form-control" id="verify-email-address" name="email" th:value="${email}"
                       required autocomplete="email">
                <div class="form-hint">We'll send a new activation link, valid for 24 hours.</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send a new link</button>
        </form>
        <p class="mt-4 mb-0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</div>
</body>
</html>
