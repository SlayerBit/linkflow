<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Sign In — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth">
        <th:block th:replace="~{layout/auth-panel :: panel('The workspace is one hop past the edge.', 'Sign in to issue links and read the click stream from the same session.')}"></th:block>
        <div class="lf-auth-form">
            <div class="lf-auth-form-inner">
                <h1>Sign in</h1>
                <p class="text-muted mb-4">Use the address you registered with.</p>

                <div class="alert alert-warning alert-premium mb-3" th:if="${param.expired}">Your session has expired. Please sign in again.</div>
                <div class="alert alert-danger alert-premium mb-3" role="alert" th:if="${errorMessage}" th:text="${errorMessage}">Error</div>
                <div class="alert alert-info alert-premium mb-3" th:if="${showVerifyLink}">
                    Need to verify your email? <a th:href="@{/verify-email}" class="fw-semibold">Verify email</a>
                </div>
                <div class="alert alert-success alert-premium mb-3" role="status" th:if="${successMessage}" th:text="${successMessage}">Success</div>

                <form th:action="@{/login}" th:object="${loginForm}" method="post">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email address</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="name@example.com" required autocomplete="email">
                        <div class="field-error" id="email-error" data-field="email" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="mb-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <label class="form-label" for="password">Password</label>
                            <a th:href="@{/forgot-password}" class="small text-decoration-none">Forgot password?</a>
                        </div>
                        <input type="password" class="form-control" th:field="*{password}" required autocomplete="current-password">
                        <div class="field-error" id="password-error" data-field="password" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Sign in</button>
                </form>

                <p class="text-muted mt-4 mb-0">
                    Don't have an account? <a th:href="@{/register}" class="fw-semibold">Create account</a>
                </p>
            </div>
        </div>
    </div>
</div>
</body>
</html>
