<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Forgot Password — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-xl-5 col-lg-7">
            <div class="card overflow-hidden" style="border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); border-radius: 16px;">
                <div class="card-body p-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="avatar avatar-xl bg-yellow-lt rounded-circle mb-3" style="width: 5rem; height: 5rem; font-size: 2.25rem;">
                            <i class="ti ti-key"></i>
                        </span>
                        <h2 class="fw-bold text-dark mb-1">Forgot Password</h2>
                        <p class="text-muted">Enter your email address to receive a password reset token</p>
                    </div>

                    <div class="alert alert-danger alert-premium d-flex align-items-center mb-4" th:if="${errorMessage}">
                        <i class="ti ti-alert-circle fs-2 me-2"></i>
                        <div th:text="${errorMessage}">Error</div>
                    </div>

                    <!-- Simulation Banner: show reset token -->
                    <div class="alert alert-warning alert-premium d-flex align-items-start mb-4" th:if="${resetToken != null}">
                        <i class="ti ti-info-circle fs-2 me-2 mt-1"></i>
                        <div>
                            <strong>Email Simulation Mode</strong><br>
                            <span class="small">Your password reset token is shown below. Use it on the reset password page.</span>
                            <div class="mt-2 p-2 bg-dark text-white rounded" style="font-family: monospace; word-break: break-all; font-size: 0.75rem;" th:text="${resetToken}"></div>
                            <a th:href="@{/reset-password(token=${resetToken})}" class="btn btn-sm btn-primary mt-2">
                                <i class="ti ti-arrow-right me-1"></i> Go to Reset Password
                            </a>
                        </div>
                    </div>

                    <form th:action="@{/forgot-password}" method="post" th:if="${resetToken == null}">
                        <div class="mb-4">
                            <label class="form-label" style="font-weight: 500;">Email address</label>
                            <input type="email" class="form-control" name="email" placeholder="name@example.com" required style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Request Reset Token</button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
