<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Forgot Password — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth-narrow">
        <h1 class="page-title mb-2" th:text="${successMessage != null} ? 'Check your email' : 'Forgot password'">Forgot password</h1>
        <p class="text-muted mb-4" th:unless="${successMessage != null}">
            We'll email a link to choose a new password. It expires in 15 minutes.
        </p>

        <form th:action="@{/forgot-password}" method="post" th:if="${successMessage == null}">
            <div class="mb-4">
                <label class="form-label" for="email">Email address</label>
                <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
            </div>
            <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>

        <p class="mt-4 mb-0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</div>
</body>
</html>
