<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Reset Password — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="lf-auth-narrow" th:with="hasToken=${token != null and !token.isEmpty()},
                                  done=${successMessage != null},
                                  heading=${done ? 'Password updated' : (hasToken ? 'Choose a new password' : 'Link needed')},
                                  subheading=${done
                                        ? 'Sign in with your new password.'
                                        : (hasToken
                                            ? 'Pick something you have not used elsewhere.'
                                            : 'Open the reset link from your email to continue.')}">
        <h1 class="page-title mb-2" th:text="${heading}">Choose a new password</h1>
        <p class="text-muted mb-4" th:text="${subheading}">Pick something you have not used elsewhere.</p>

        <form th:action="@{/reset-password}" method="post" th:if="${hasToken and !done}">
            <input type="hidden" name="token" th:value="${token}">
            <div class="mb-3">
                <label class="form-label" for="reset-new-password">New password</label>
                <input type="password" class="form-control" id="reset-new-password" name="newPassword"
                       required minlength="8" autocomplete="new-password">
                <div class="form-hint">At least 8 characters.</div>
            </div>
            <div class="mb-4">
                <label class="form-label" for="reset-confirm-password">Confirm password</label>
                <input type="password" class="form-control" id="reset-confirm-password" name="confirmPassword"
                       required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Reset password</button>
        </form>

        <div th:if="${!hasToken and !done}" class="mt-3">
            <a th:href="@{/forgot-password}" class="btn btn-primary">Request a reset link</a>
        </div>
        <div th:if="${done}" class="mt-3">
            <a th:href="@{/login}" class="btn btn-primary">Sign in</a>
        </div>
        <p class="mt-4 mb-0"><a th:href="@{/login}">Back to sign in</a></p>
    </div>
</div>
</body>
</html>
