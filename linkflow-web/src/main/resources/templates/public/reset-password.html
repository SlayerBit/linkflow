<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Reset Password — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-xl-5 col-lg-7">
            <div class="card overflow-hidden" style="border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); border-radius: 16px;">
                <div class="card-body p-5 bg-white">
                    <!--/*
                      Three states: the form (arrived with a token), done (password changed), and
                      the dead end where the page was opened without a token. The token travels in a
                      hidden field rather than a text input — it is a 64-character random string that
                      nobody types, and prompting them to paste one invited exactly the confusion it
                      looks like it would.

                      Thymeleaf parser-level comment, not a plain HTML one: this is a note to the
                      next person editing the template, and a plain comment would be shipped to
                      every visitor's browser along with the page.
                    */-->
                    <div th:with="hasToken=${token != null and !token.isEmpty()},
                                  done=${successMessage != null},
                                  badgeClass=${done ? 'bg-green-lt' : (hasToken ? 'bg-blue-lt' : 'bg-orange-lt')},
                                  iconClass=${done ? 'ti ti-circle-check' : (hasToken ? 'ti ti-lock-open' : 'ti ti-link-off')},
                                  heading=${done ? 'Password updated' : (hasToken ? 'Choose a new password' : 'Link needed')},
                                  subheading=${done
                                        ? 'Sign in with your new password.'
                                        : (hasToken
                                            ? 'Pick something you have not used elsewhere.'
                                            : 'Open the reset link from your email to continue.')}">

                        <div class="text-center mb-4">
                            <span class="avatar avatar-xl rounded-circle mb-3" th:classappend="${badgeClass}"
                                  style="width: 5rem; height: 5rem; font-size: 2.25rem;">
                                <i th:class="${iconClass}"></i>
                            </span>
                            <h2 class="fw-bold text-dark mb-1" th:text="${heading}">Choose a new password</h2>
                            <p class="text-muted mb-0" th:text="${subheading}">
                                Pick something you have not used elsewhere.
                            </p>
                        </div>

                        <div class="alert alert-success alert-premium d-flex align-items-center mb-4" role="status" th:if="${successMessage}">
                            <i class="ti ti-circle-check fs-2 me-2"></i>
                            <div th:text="${successMessage}">Success</div>
                        </div>
                        <div class="alert alert-danger alert-premium d-flex align-items-center mb-4" role="alert" th:if="${errorMessage}">
                            <i class="ti ti-alert-circle fs-2 me-2"></i>
                            <div th:text="${errorMessage}">Error</div>
                        </div>

                        <form th:action="@{/reset-password}" method="post" th:if="${hasToken and !done}">
                            <input type="hidden" name="token" th:value="${token}">
                            <div class="mb-3">
                                <label class="form-label" for="reset-new-password" style="font-weight: 500;">New Password</label>
                                <input type="password" class="form-control" id="reset-new-password" name="newPassword"
                                       placeholder="At least 8 characters" required minlength="8"
                                       autocomplete="new-password" style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                                <div class="form-hint mt-1" style="font-size: 0.725rem; color: #64748b;">At least 8 characters.</div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="reset-confirm-password" style="font-weight: 500;">Confirm New Password</label>
                                <input type="password" class="form-control" id="reset-confirm-password" name="confirmPassword"
                                       placeholder="Re-enter new password" required minlength="8"
                                       autocomplete="new-password" style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Reset Password</button>
                        </form>

                        <div th:if="${!hasToken and !done}" class="text-center mt-3">
                            <a th:href="@{/forgot-password}" class="btn btn-primary px-4 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">
                                Request a reset link
                            </a>
                        </div>

                        <div th:if="${done}" class="text-center mt-3">
                            <a th:href="@{/login}" class="btn btn-primary px-4 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Go to Login</a>
                        </div>

                        <p class="text-center text-muted mt-4 mb-0">
                            <a th:href="@{/login}" class="fw-semibold text-decoration-none">Back to Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
