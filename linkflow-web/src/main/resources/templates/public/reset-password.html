<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Reset Password — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center py-4">
        <div class="col-xl-5 col-lg-7">
            <div class="card overflow-hidden" style="border: 1px solid rgba(15, 23, 42, 0.08); box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08); border-radius: 16px;">
                <div class="card-body p-5 bg-white">
                    <div class="text-center mb-4">
                        <span class="avatar avatar-xl bg-blue-lt rounded-circle mb-3" style="width: 5rem; height: 5rem; font-size: 2.25rem;">
                            <i class="ti ti-lock-open"></i>
                        </span>
                        <h2 class="fw-bold text-dark mb-1">Reset Password</h2>
                        <p class="text-muted">Enter your reset token and choose a new password</p>
                    </div>

                    <div class="alert alert-success alert-premium d-flex align-items-center mb-4" th:if="${successMessage}">
                        <i class="ti ti-circle-check fs-2 me-2"></i>
                        <div th:text="${successMessage}">Success</div>
                    </div>
                    <div class="alert alert-danger alert-premium d-flex align-items-center mb-4" th:if="${errorMessage}">
                        <i class="ti ti-alert-circle fs-2 me-2"></i>
                        <div th:text="${errorMessage}">Error</div>
                    </div>

                    <form th:action="@{/reset-password}" method="post" th:if="${successMessage == null}">
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">Reset Token</label>
                            <input type="text" class="form-control" name="token" th:value="${token}" placeholder="Paste your reset token" required style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" style="font-weight: 500;">New Password</label>
                            <input type="password" class="form-control" name="newPassword" placeholder="At least 8 characters" required style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                            <div class="form-hint mt-1" style="font-size: 0.725rem; color: #64748b;">Must contain uppercase, lowercase, numbers, and special characters.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label" style="font-weight: 500;">Confirm New Password</label>
                            <input type="password" class="form-control" name="confirmPassword" placeholder="Re-enter new password" required style="border-radius: 8px; padding: 0.6rem 0.8rem;">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Reset Password</button>
                    </form>

                    <div th:if="${successMessage != null}" class="text-center mt-3">
                        <a th:href="@{/login}" class="btn btn-primary px-4 py-2 shadow-sm" style="border-radius: 8px; font-weight: 600;">Go to Login</a>
                    </div>

                    <p class="text-center text-muted mt-4 mb-0">
                        <a th:href="@{/login}" class="fw-semibold text-decoration-none">Back to Login</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
