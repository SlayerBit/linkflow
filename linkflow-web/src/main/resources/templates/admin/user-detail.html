<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>User Details</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none">
        <div class="page-pretitle"><a th:href="@{/admin/users}">Users</a></div>
        <h2 class="page-title" th:text="${user.email}">user</h2>
    </div>

    <div class="card">
        <div class="card-body">
            <dl class="row">
                <dt class="col-sm-3">ID</dt><dd class="col-sm-9"><code th:text="${user.id}">id</code></dd>
                <dt class="col-sm-3">Email</dt><dd class="col-sm-9" th:text="${user.email}">email</dd>
                <dt class="col-sm-3">First name</dt><dd class="col-sm-9" th:text="${user.firstName}">first</dd>
                <dt class="col-sm-3">Last name</dt><dd class="col-sm-9" th:text="${user.lastName != null ? user.lastName : '—'}">last</dd>
                <dt class="col-sm-3">Roles</dt>
                <dd class="col-sm-9">
                    <span th:each="role : ${user.roles}" class="badge bg-blue-lt me-1" th:text="${role}">USER</span>
                </dd>
                <dt class="col-sm-3">Created</dt><dd class="col-sm-9" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm ''UTC''')}">date</dd>
                <dt class="col-sm-3">Updated</dt><dd class="col-sm-9" th:text="${#temporals.format(user.updatedAt, 'yyyy-MM-dd HH:mm ''UTC''')}">date</dd>
            </dl>
        </div>
    </div>

    <div class="alert alert-info mt-3">
        Per-user URL listing is not available — the backend only exposes user profile data for admin user detail.
    </div>
</div>
</body>
</html>
