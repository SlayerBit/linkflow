<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>System Analytics</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none"><h2 class="page-title">System Analytics</h2></div>

    <div class="row row-deck row-cards mb-4">
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header"><h3 class="card-title">URL status breakdown</h3></div>
                <div class="card-body">
                    <div class="chart-container"><canvas id="statusChart"></canvas></div>
                </div>
            </div>
        </div>
        <div class="col-lg-8">
            <div class="card">
                <div class="card-header"><h3 class="card-title">Top URLs</h3></div>
                <div class="card-body">
                    <div class="chart-container" th:if="${!#lists.isEmpty(topUrls)}">
                        <canvas id="topChart"></canvas>
                    </div>
                    <p class="text-muted mb-0" th:if="${#lists.isEmpty(topUrls)}">No top URL data yet.</p>
                </div>
            </div>
        </div>
    </div>

    <div class="row row-deck row-cards">
        <div class="col-sm-4"><div class="card stat-card"><div class="card-body">
            <div class="subheader">Users</div><div class="h2" th:text="${stats.totalUsers}">0</div>
        </div></div></div>
        <div class="col-sm-4"><div class="card stat-card"><div class="card-body">
            <div class="subheader">Total clicks</div><div class="h2" th:text="${stats.totalClicks}">0</div>
        </div></div></div>
        <div class="col-sm-4"><div class="card stat-card"><div class="card-body">
            <div class="subheader">Total URLs</div><div class="h2" th:text="${stats.totalUrls}">0</div>
        </div></div></div>
    </div>

    <div class="row row-deck row-cards mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex align-items-center">
                    <h3 class="card-title">Platform Clicks Over Time</h3>
                    <div class="ms-auto">
                        <div class="btn-group">
                            <button type="button" class="btn btn-sm btn-outline-secondary btn-trend-range" id="btn-trend-7" onclick="renderTrendChart(7)">7D</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary btn-trend-range" id="btn-trend-30" onclick="renderTrendChart(30)">30D</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary btn-trend-range" id="btn-trend-90" onclick="renderTrendChart(90)">90D</button>
                        </div>
                    </div>
                </div>
                <div class="card-body">
                    <div class="chart-container" style="position: relative; height: 320px;">
                        <canvas id="platformClickTrendChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script th:inline="javascript">
        const stats = /*[[${statsJson}]]*/ {};
        new Chart(document.getElementById('statusChart'), {
            type: 'doughnut',
            data: {
                labels: ['Active', 'Expired', 'Deleted'],
                datasets: [{ data: [stats.activeUrls, stats.expiredUrls, stats.deletedUrls],
                    backgroundColor: ['#2fb344', '#f76707', '#d63939'] }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });
        
        const topUrls = /*[[${topUrlsJson}]]*/ [];
        if (topUrls.length) {
            new Chart(document.getElementById('topChart'), {
                type: 'bar',
                data: {
                    labels: topUrls.map(u => u.shortCode),
                    datasets: [{ data: topUrls.map(u => u.totalClicks), backgroundColor: '#206bc4' }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        const trends = {
            7: /*[[${trend7dJson}]]*/ '[]',
            30: /*[[${trend30dJson}]]*/ '[]',
            90: /*[[${trend90dJson}]]*/ '[]'
        };

        const data7d = JSON.parse(trends[7]);
        const data30d = JSON.parse(trends[30]);
        const data90d = JSON.parse(trends[90]);

        function getPaddedData(trendData, days) {
            const labels = [];
            const dataMap = {};
            for (let i = days - 1; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                labels.push(dateStr);
                dataMap[dateStr] = 0;
            }
            trendData.forEach(item => {
                if (dataMap[item.date] !== undefined) {
                    dataMap[item.date] = item.clicks;
                }
            });
            const dataPoints = labels.map(l => dataMap[l]);
            return { labels, dataPoints };
        }

        let currentTrendChart = null;

        function renderTrendChart(days) {
            let rawData;
            if (days === 7) rawData = data7d;
            else if (days === 90) rawData = data90d;
            else rawData = data30d;

            const { labels, dataPoints } = getPaddedData(rawData, days);

            if (currentTrendChart) {
                currentTrendChart.destroy();
            }

            const ctx = document.getElementById('platformClickTrendChart').getContext('2d');
            currentTrendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'System Clicks',
                        data: dataPoints,
                        borderColor: '#206bc4',
                        backgroundColor: 'rgba(32, 107, 196, 0.08)',
                        fill: true,
                        tension: 0.2,
                        borderWidth: 2,
                        pointRadius: days > 30 ? 1 : 3,
                        pointHoverRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: {
                            grid: { display: false }
                        },
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });

            document.querySelectorAll('.btn-trend-range').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeBtn = document.getElementById('btn-trend-' + days);
            if (activeBtn) activeBtn.classList.add('active');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderTrendChart(30);
        });
    </script>
</th:block>
</body>
</html>
