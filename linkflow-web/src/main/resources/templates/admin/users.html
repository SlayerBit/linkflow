<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title>Users Management — LinkFlow</title></head>
<body>
<div layout:fragment="content">
    <div class="page-header d-print-none mb-4">
        <h2 class="page-title fw-bold text-dark fs-2">Users Management</h2>
    </div>

    <div class="card bg-white" th:if="${!#lists.isEmpty(users.content)}">
        <div class="card-header">
            <h3 class="card-title fw-bold text-dark section-header-title color-purple mb-0">
                <i class="ti ti-users"></i> Registered Platform Users
            </h3>
        </div>
        <div class="table-responsive">
            <table class="table table-vcenter card-table table-hover table-stack">
                <thead>
                    <tr>
                        <th>Email Address</th>
                        <th>Full Name</th>
                        <th>Roles</th>
                        <th>Created Date</th>
                        <th class="w-1">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user : ${users.content}">
                        <td class="fw-bold text-dark" data-label="Email Address" th:text="${user.email}">email</td>
                        <td class="text-secondary" data-label="Full Name" th:text="${user.firstName + ' ' + (user.lastName != null ? user.lastName : '')}">name</td>
                        <td data-label="Roles">
                            <span th:each="role : ${user.roles}" class="badge bg-purple-lt text-purple me-1 fw-bold" th:text="${role}">USER</span>
                        </td>
                        <td class="text-secondary" data-label="Created Date" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd')}">date</td>
                        <td class="text-end" data-label="Actions">
                            <a th:href="@{/admin/users/{id}(id=${user.id})}" class="btn btn-sm btn-light" style="border-radius: 6px;">View details</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="card bg-white empty-state" th:if="${#lists.isEmpty(users.content)}">
        <div class="empty-state-icon"><i class="ti ti-users"></i></div>
        <div class="empty-state-title">No users found</div>
        <p class="empty-state-description">No registered users exist on the platform currently.</p>
    </div>

    <div th:replace="~{fragments/alerts :: pagination(${users}, '/admin/users', ${sortBy}, ${direction})}"></div>
</div>
</body>
</html>
