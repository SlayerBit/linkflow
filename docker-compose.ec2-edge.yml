# EC2 #1 Edge & Infrastructure Compose Configuration
#
# Runs Nginx (edge proxy/TLS), Redis (shared state/sessions), Prometheus (metrics collection),
# and Grafana (dashboards).
#
# Nginx and Prometheus resolve the stable upstream names app1, app2, app3 via extra_hosts,
# which maps them to the private VPC IPs of EC2 #2, #3, #4. Set APP_NODE_1_IP, APP_NODE_2_IP,
# APP_NODE_3_IP in .env on this instance.
#
# Usage on EC2 #1:
#   docker compose -f docker-compose.ec2-edge.yml up -d

name: linkflow-edge

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Map stable upstream names to private VPC IPs. Nginx resolves upstream hostnames at startup,
    # and these entries go into /etc/hosts inside the container. The Nginx config uses app1:8080
    # etc., which is deterministic and committed — only .env varies per deployment.
    extra_hosts:
      - "app1:${APP_NODE_1_IP}"
      - "app2:${APP_NODE_2_IP}"
      - "app3:${APP_NODE_3_IP}"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/linkflow-ec2.conf:/etc/nginx/conf.d/linkflow.conf:ro
      - ./infrastructure/nginx/conf.d/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro
      - /dev/null:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --bind
      - "0.0.0.0"
    ports:
      # Bind to the EC2 private IP so app nodes on the VPC can reach Redis, but it is NOT
      # exposed to the public internet. Set REDIS_BIND_ADDRESS to the EC2 #1 private IP.
      # Falls back to 0.0.0.0 only so local development is not broken; production .env MUST
      # set this to the private IP.
      - "${REDIS_BIND_ADDRESS:-0.0.0.0}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    ports:
      # Bound to localhost: access via SSH tunnel or local curl on EC2 #1.
      - "127.0.0.1:9090:9090"
    # Prometheus also needs to resolve app1/app2/app3 for its scrape targets.
    extra_hosts:
      - "app1:${APP_NODE_1_IP}"
      - "app2:${APP_NODE_2_IP}"
      - "app3:${APP_NODE_3_IP}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infrastructure/prometheus/prometheus-ec2.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    ports:
      # Bound to localhost: access via SSH tunnel (ssh -L 3000:127.0.0.1:3000 ec2-user@edge).
      # An admin dashboard must not be publicly reachable.
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infrastructure/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/grafana/provisioning/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
  certbot-webroot:
