# LinkFlow 4-EC2 Production Prometheus Configuration
#
# Scrapes metrics from all 3 application nodes. Upstream names app1, app2, app3 are resolved by
# Docker's extra_hosts in docker-compose.ec2-edge.yml, which maps them to the private VPC IPs
# set in .env on EC2 #1.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: linkflow-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "app1:8081"
          - "app2:8081"
          - "app3:8081"

  - job_name: linkflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "app1:8080"
          - "app2:8080"
          - "app3:8080"
