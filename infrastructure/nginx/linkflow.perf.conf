# LinkFlow edge server blocks: TLS termination, forwarding headers, and routing to the gateway.

# ---------------------------------------------------------------------------
# Upstream
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    # least_conn rather than round robin: redirect requests finish in single-digit milliseconds
    # while an analytics query can take far longer, so connection count tracks real load better
    # than request count does.
    least_conn;

    server linkflow-gateway:8080 max_fails=3 fail_timeout=10s;

    # To run more than one gateway, add a line per instance:
    #   server linkflow-gateway-2:8080 max_fails=3 fail_timeout=10s;
    # Compose's DNS returns every replica's address for a scaled service, but Nginx resolves
    # upstream names once at startup, so `docker compose up --scale` alone will not spread load.
    # Listing instances explicitly keeps what actually happens visible in the config.

    # Reuse connections to the gateway instead of completing a TCP (and, at scale, TLS) handshake
    # per request. Requires HTTP/1.1 and a cleared Connection header, set in the location blocks.
    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The one exception to the redirect: ACME HTTP-01 validation must be answered over plain HTTP,
    # so certificate renewal does not depend on the certificate being valid.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health is answered here as well as over TLS, because container and load balancer probes are
    # local and unauthenticated. Sending them through the redirect would force them into a TLS
    # handshake they have no reason to perform, and against a self-signed certificate they cannot
    # verify — which is exactly how this check reported the container unhealthy while it was
    # serving traffic perfectly well.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 301, not 302: this is permanent, and a cached redirect means later visits never traverse
    # plaintext at all.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/linkflow.crt;
    ssl_certificate_key /etc/nginx/certs/linkflow.key;

    # TLS 1.2 is the floor. 1.0 and 1.1 are deprecated and their ciphers are broken; anything old
    # enough to need them cannot safely use the site regardless.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Forward secrecy only, AEAD only. TLS 1.3 ignores this list and negotiates its own suites.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Let the client choose: modern clients pick ChaCha20 on hardware without AES acceleration,
    # and they know their own hardware better than a static server-side ordering does.
    ssl_prefer_server_ciphers off;

    # Resumption avoids a full handshake on reconnect. Tickets are off because rotating them
    # properly across instances is easy to get wrong, and a leaked long-lived ticket key
    # retroactively defeats forward secrecy.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HSTS is set here, at the TLS boundary, and stripped from upstream responses so it appears
    # exactly once. Every other security header stays with the application, which knows the
    # context — in particular the per-request CSP nonce, which Nginx could not reproduce.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn perip 50;

    # -----------------------------------------------------------------
    # Nginx's own liveness, answered without touching the gateway, so an
    # external load balancer can tell "Nginx is down" from "the app is down".
    # -----------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------
    # Actuator is not for the internet. Prometheus scrapes the gateway and app directly over the
    # private network, so blocking it here costs nothing and keeps /actuator/metrics and
    # /actuator/prometheus — which leak internals, and route names — off the public surface.
    # -----------------------------------------------------------------
    location /actuator/ {
        deny all;
    }

    # -----------------------------------------------------------------
    # Credential endpoints: strict throttling, and bodies never logged.
    # -----------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        # burst absorbs a user legitimately retrying or double-submitting a form; nodelay serves
        # those immediately rather than queueing them, while still capping the sustained rate.
        limit_req zone=auth burst=500 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # -----------------------------------------------------------------
    # Static assets. Served through the app rather than from disk here, because they live inside
    # the web jar and duplicating them into the Nginx image would let the two drift apart.
    # -----------------------------------------------------------------
    location ~ ^/(css|js|vendor|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # Cached by the browser but revalidated, deliberately. These filenames are not
        # content-hashed, so a long immutable TTL would leave visitors on stale CSS after a
        # deploy with no way to correct it. A conditional request costs one round trip and
        # usually returns 304 with no body.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # -----------------------------------------------------------------
    # Short-link redirects. The hot path, and the one thing that must not be cached: every hit is
    # a counted click, and the target can be changed or deactivated at any time.
    # -----------------------------------------------------------------
    location /r/ {
        limit_req zone=general burst=5000 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------
    # Everything else: API and the server-rendered UI.
    # -----------------------------------------------------------------
    location / {
        limit_req zone=general burst=5000 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
