# LinkFlow 4-EC2 Production Nginx Configuration
#
# Three application nodes behind least_conn load balancing. Upstream names app1, app2, app3 are
# resolved by Docker's extra_hosts in docker-compose.ec2-edge.yml, which maps them to the private
# VPC IPs set in .env. The configuration itself is deterministic and version-controlled — only
# .env varies between deployments.
#
# This file is mounted as a template (*.template) inside the nginx container. The nginx image's
# built-in entrypoint (20-envsubst-on-templates.sh) substitutes ${DOMAIN_NAME} at container start,
# producing the final config in /etc/nginx/conf.d/. Upstream hostnames (app1, app2, app3) are NOT
# shell variables — they are resolved by DNS via extra_hosts.
#
# HTTPS uses Let's Encrypt certificates at /etc/letsencrypt/live/${DOMAIN_NAME}/. Obtain with:
#   certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#
# Until certificates exist, Nginx will refuse to start. Run certbot first, then start the stack.

# ---------------------------------------------------------------------------
# Upstream — Gateway Nodes
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    # least_conn rather than round robin: redirect requests finish in single-digit milliseconds
    # while an analytics query can take far longer, so connection count tracks real load better
    # than request count does.
    least_conn;

    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;

    # Reuse connections to the gateway instead of completing a TCP handshake per request.
    # Requires HTTP/1.1 and a cleared Connection header, set in the location blocks via
    # proxy-headers.inc.
    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 validation must be answered over plain HTTP so certificate renewal does not
    # depend on the certificate being valid.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health is answered here as well as over TLS: container and load balancer probes are local
    # and unauthenticated. Sending them through the redirect would force a TLS handshake they
    # have no reason to perform.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # 301, not 302: permanent, and a cached redirect means later visits never traverse plaintext.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN_NAME};

    # Let's Encrypt certificates. The path derives from DOMAIN_NAME, which the nginx container's
    # entrypoint substitutes at startup. Changing domains only requires updating .env.
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN_NAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN_NAME}/privkey.pem;

    # TLS 1.2 is the floor. 1.0 and 1.1 are deprecated and their ciphers are broken.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Forward secrecy only, AEAD only. TLS 1.3 ignores this list and negotiates its own suites.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    # Let the client choose: modern clients pick ChaCha20 on hardware without AES acceleration.
    ssl_prefer_server_ciphers off;

    # Resumption avoids a full handshake on reconnect. Tickets are off because rotating them
    # across instances is easy to get wrong, and a leaked long-lived ticket key retroactively
    # defeats forward secrecy.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # HSTS set here, at the TLS boundary, stripped from upstream so it appears exactly once.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn perip 50;

    # -----------------------------------------------------------------
    # Nginx liveness, answered without touching the gateway so an
    # external probe can tell "Nginx is down" from "the app is down".
    # -----------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # -----------------------------------------------------------------
    # Actuator is not for the internet. Prometheus scrapes the gateway
    # and app directly over the private network.
    # -----------------------------------------------------------------
    location /actuator/ {
        deny all;
    }

    # -----------------------------------------------------------------
    # Credential endpoints: strict throttling.
    # -----------------------------------------------------------------
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # -----------------------------------------------------------------
    # Static assets. Served through the app rather than from disk here,
    # because they live inside the web jar and duplicating them would
    # let the two drift apart. Includes /vendor/ for Tabler, Chart.js,
    # and Tabler Icons.
    # -----------------------------------------------------------------
    location ~ ^/(css|js|vendor|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        # Cached but revalidated: filenames are not content-hashed, so a long immutable TTL
        # would leave visitors on stale CSS after a deploy.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # -----------------------------------------------------------------
    # Short-link redirects. The hot path, and the one thing that must
    # not be cached: every hit is a counted click.
    # -----------------------------------------------------------------
    location /r/ {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------
    # Everything else: API and the server-rendered UI.
    # -----------------------------------------------------------------
    location / {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
