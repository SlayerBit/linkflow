# LinkFlow EC2 Production Nginx Configuration
#
# Stage 1 (2-EC2): Direct HTTP reverse proxy over EC2 #1 IP (35.154.226.7) -> EC2 #2 Gateway (172.31.5.37:8080)
# Stage 2 (4-EC2 & Domain): Enable HTTPS server block & Let's Encrypt TLS termination.

# ---------------------------------------------------------------------------
# Upstream — Gateway Nodes
# For Stage 1 (2-EC2 deployment), only EC2 #2 is active.
# When expanding to Stage 2 (4-EC2 deployment), uncomment EC2 #3 and #4.
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    least_conn;

    server 172.31.5.37:8080 max_fails=3 fail_timeout=10s; # EC2 #2 (Stage 1)
    # server 10.0.1.103:8080 max_fails=3 fail_timeout=10s; # EC2 #3 (Stage 2)
    # server 10.0.1.104:8080 max_fails=3 fail_timeout=10s; # EC2 #4 (Stage 2)

    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# HTTP Server — Reverse proxy for Stage 1 IP-based deployment
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge for Let's Encrypt certbot (future HTTPS setup)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated health check for edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block public access to Actuator endpoints on edge
    location /actuator/ {
        deny all;
    }

    # Auth endpoints
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Static assets
    location ~ ^/(css|js|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Short-link redirects
    location /r/ {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Main API & Web UI
    location / {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
