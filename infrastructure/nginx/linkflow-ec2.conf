# LinkFlow 4-EC2 Production Nginx Configuration
#
# Architecture:
# - Upstream 'linkflow_gateway' load-balances across app1, app2, app3 using least_conn.
# - The stable hostnames app1, app2, app3 are resolved via Docker's extra_hosts in
#   docker-compose.ec2-edge.yml, mapping them to the private VPC IPs from .env.
# - Configuration is committed and deterministic (no runtime envsubst required).

# ---------------------------------------------------------------------------
# WebSocket upgrade mapping
# ---------------------------------------------------------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# ---------------------------------------------------------------------------
# Upstream — Gateway Nodes (All 3 application instances)
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    least_conn;

    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# Default Server — Fallback for unmatched hostnames / IP probes
# Leaves root domain (slayerbit.me) untouched for future use.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME HTTP-01 challenge fallback
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated health check for IP-based edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Root domain and unmatched hostnames are left unconfigured
    location / {
        return 404;
    }
}

# ---------------------------------------------------------------------------
# HTTP Server — ACME Challenge, Health Check, & HTTP -> HTTPS Redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name linkflow.slayerbit.me;

    # ACME HTTP-01 validation for Let's Encrypt certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated health check for edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Redirect all other HTTP traffic for LinkFlow to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS Server — Production Reverse Proxy with TLS (linkflow.slayerbit.me)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name linkflow.slayerbit.me;

    ssl_certificate     /etc/letsencrypt/live/linkflow.slayerbit.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/linkflow.slayerbit.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_conn perip 50;

    # Unauthenticated health check for edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block public access to Actuator endpoints on edge
    location /actuator/ {
        deny all;
    }

    # Auth endpoints — rate limited
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Static assets — includes /vendor/ for Tabler, Chart.js, and Tabler Icons
    location ~ ^/(css|js|vendor|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Short-link redirects — no cache (every hit is a counted click)
    location /r/ {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Main API & Web UI (with WebSocket upgrade support)
    location / {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

