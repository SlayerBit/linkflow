# LinkFlow 4-EC2 Production Nginx Configuration
#
# Architecture:
# - Upstream 'linkflow_gateway' load-balances across app1, app2, app3 using least_conn.
# - The stable hostnames app1, app2, app3 are resolved via Docker's extra_hosts in
#   docker-compose.ec2-edge.yml, mapping them to the private VPC IPs from .env.
# - Configuration is committed and deterministic (no runtime envsubst required).
#
# Staged Deployment Modes:
# - Stage 1 (Current / IP validation mode): Direct HTTP reverse proxy on port 80.
#   Does not require a domain or TLS certificates to start.
# - Stage 2 (Production HTTPS mode): Enable the HTTPS server block below after running certbot:
#     certbot certonly --webroot -w /var/www/certbot -d yourdomain.com

# ---------------------------------------------------------------------------
# Upstream — Gateway Nodes (All 3 application instances)
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    least_conn;

    server app1:8080 max_fails=3 fail_timeout=10s;
    server app2:8080 max_fails=3 fail_timeout=10s;
    server app3:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# HTTP Server — Reverse Proxy (Stage 1 / IP Mode & ACME Challenge)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 validation for Let's Encrypt certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated health check for edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block public access to Actuator endpoints on edge
    location /actuator/ {
        deny all;
    }

    # Auth endpoints — rate limited
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Static assets — includes /vendor/ for Tabler, Chart.js, and Tabler Icons
    location ~ ^/(css|js|vendor|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Short-link redirects — no cache (every hit is a counted click)
    location /r/ {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Main API & Web UI
    location / {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}

# ---------------------------------------------------------------------------
