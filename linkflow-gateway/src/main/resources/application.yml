server:
  port: 8080
  forward-headers-strategy: framework
  shutdown: graceful

spring:
  application:
    name: linkflow-gateway
  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_SHUTDOWN_TIMEOUT:25s}
  cloud:
    gateway:
      httpclient:
        # Bounds how long a request may occupy the gateway when an upstream stops responding.
        # Without these a hung backend would hold connections until the client gave up.
        connect-timeout: ${LINKFLOW_GATEWAY_CONNECT_TIMEOUT_MS:2000}
        response-timeout: ${LINKFLOW_GATEWAY_RESPONSE_TIMEOUT:15s}
      routes:
        - id: linkflow-api
          uri: ${LINKFLOW_APP_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/api/**
        - id: linkflow-redirect
          uri: ${LINKFLOW_APP_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/r/**
        - id: linkflow-swagger
          uri: ${LINKFLOW_APP_URI:http://127.0.0.1:8081}
          predicates:
            - Path=/swagger-ui/**,/v3/api-docs/**
        - id: linkflow-web-static
          uri: ${LINKFLOW_WEB_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/css/**,/js/**,/vendor/**,/webjars/**
        - id: linkflow-web
          uri: ${LINKFLOW_WEB_URI:http://127.0.0.1:8082}
          predicates:
            - Path=/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # The gateway holds no state of its own; if it is running it can route.
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    org.springframework.cloud.gateway: INFO
