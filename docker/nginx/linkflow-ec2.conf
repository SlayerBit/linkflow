# LinkFlow EC2 Production Nginx Configuration
#
# Load-balances traffic across 3 independent LinkFlow Gateway instances (EC2 #2, #3, #4)
# with TLS termination via Let's Encrypt.
#
# Replace <EC2_2_PRIVATE_IP>, <EC2_3_PRIVATE_IP>, <EC2_4_PRIVATE_IP>, and <DOMAIN_NAME>
# with actual deployment values.

# ---------------------------------------------------------------------------
# Upstream — Gateway Nodes
# For Stage 1 (2-EC2 deployment), only EC2 #2 is active.
# When expanding to Stage 2 (4-EC2 deployment), uncomment EC2 #3 and #4.
# Replace 10.0.1.102 (etc.) with actual private IPs of your EC2 application nodes.
# ---------------------------------------------------------------------------
upstream linkflow_gateway {
    least_conn;

    server 10.0.1.102:8080 max_fails=3 fail_timeout=10s; # EC2 #2 (Stage 1)
    # server 10.0.1.103:8080 max_fails=3 fail_timeout=10s; # EC2 #3 (Stage 2)
    # server 10.0.1.104:8080 max_fails=3 fail_timeout=10s; # EC2 #4 (Stage 2)

    keepalive 32;
    keepalive_timeout 60s;
}

# ---------------------------------------------------------------------------
# HTTP — ACME challenge & HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge for Let's Encrypt certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Unauthenticated health check for edge probes
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — Production Edge with TLS Termination
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Let's Encrypt certificate paths (mounted from host /etc/letsencrypt)
    # Update <DOMAIN_NAME> to match your actual domain name.
    ssl_certificate     /etc/letsencrypt/live/DOMAIN_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN_NAME/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    limit_conn perip 50;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block public access to Actuator on edge
    location /actuator/ {
        deny all;
    }

    # Auth endpoints
    location ~ ^/api/v1/auth/(login|register|forgot-password|resend-verification)$ {
        limit_req zone=auth burst=20 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }

    # Static assets
    location ~ ^/(css|js|webjars)/ {
        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
    }

    # Short-link redirects
    location /r/ {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    # Main API & Web UI
    location / {
        limit_req zone=general burst=200 nodelay;

        proxy_pass http://linkflow_gateway;
        include /etc/nginx/conf.d/proxy-headers.inc;
    }
}
