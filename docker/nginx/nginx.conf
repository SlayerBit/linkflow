# Global Nginx configuration for LinkFlow's edge.
#
# Nginx terminates TLS and is the only container publishing ports. Everything behind it speaks
# plain HTTP on the private Compose network, which is why the forwarding headers set in
# conf.d/linkflow.conf are the application's only source of truth about the original client.

user  nginx;

# One worker per core. Nginx is event-driven, so this is about using all cores, not about
# concurrency headroom.
worker_processes  auto;

# Must not exceed the container's file descriptor limit, or workers fail to accept under load.
worker_rlimit_nofile 8192;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    # Accept as many new connections as are pending rather than one per event loop pass.
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # $upstream_response_time and $request_time together separate "the backend was slow" from
    # "the client was slow", which is the first question worth asking about a latency report.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'cid=$http_x_correlation_id';

    access_log  /var/log/nginx/access.log main;

    # sendfile/tcp_nopush let static files go from page cache to socket without copying through
    # user space; tcp_nodelay keeps small proxied responses from waiting on Nagle's algorithm.
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout   65;
    keepalive_requests  1000;

    # Nginx's version is not useful to a client and is useful to someone fingerprinting for
    # known CVEs.
    server_tokens off;

    # Bulk URL creation is the largest legitimate request body; anything much beyond this is
    # either a mistake or an attempt to exhaust memory.
    client_max_body_size 1m;
    client_body_timeout  15s;
    client_header_timeout 15s;

    # Bound how long a slow or dead upstream can occupy a connection here. These sit just above
    # the gateway's own response timeout so the gateway reports the failure first, with context,
    # rather than Nginx returning a bare 504.
    proxy_connect_timeout 5s;
    proxy_send_timeout    20s;
    proxy_read_timeout    20s;

    # ---------------------------------------------------------------------
    # Compression
    # ---------------------------------------------------------------------
    gzip on;
    # Below roughly one MTU there is nothing to gain and compression only costs CPU.
    gzip_min_length 1024;
    gzip_comp_level 5;
    # Proxied responses are compressed too; without this Nginx skips anything with a Via header.
    gzip_proxied any;
    # Tells caches the body varies by encoding, so a compressed response is not served to a
    # client that cannot decode it.
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # Deliberately not gzipping images or fonts: they are already compressed.

    # ---------------------------------------------------------------------
    # Rate limiting
    # ---------------------------------------------------------------------
    # Coarse protection in front of the JVM. The application already enforces per-user and per-IP
    # limits with far more context, so this is not a replacement for it — the point is that a
    # volumetric flood should be dropped at the edge, before it costs a servlet thread and a
    # Redis round trip.
    #
    # $binary_remote_addr rather than $remote_addr: four bytes per entry instead of up to fifteen.
    limit_req_zone $binary_remote_addr zone=general:10m rate=100r/s;
    # Credential endpoints are throttled hard because a password guess is cheap for the attacker
    # and expensive for us: every attempt costs a BCrypt hash at strength 12.
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=perip:10m;

    include /etc/nginx/conf.d/*.conf;
}
