# LinkFlow 4-EC2 Production Prometheus Configuration
#
# Scrapes metrics from 3 LinkFlow App nodes and 3 LinkFlow Gateway nodes
# over the private VPC network.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: linkflow-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "10.0.1.102:8081" # EC2 #2 App #1
          - "10.0.1.103:8081" # EC2 #3 App #2
          - "10.0.1.104:8081" # EC2 #4 App #3

  - job_name: linkflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - "10.0.1.102:8080" # EC2 #2 Gateway #1
          - "10.0.1.103:8080" # EC2 #3 Gateway #2
          - "10.0.1.104:8080" # EC2 #4 Gateway #3
