global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: linkflow-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["linkflow-app:8081"]

  - job_name: linkflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["linkflow-gateway:8080"]
