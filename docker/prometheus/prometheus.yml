global:
  scrape_interval: 15s

scrape_configs:
  - job_name: linkflow-app
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["linkflow-app:8081"]

  - job_name: linkflow-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["linkflow-gateway:8080"]
