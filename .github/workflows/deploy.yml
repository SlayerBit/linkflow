# LinkFlow — Continuous Deployment Pipeline
#
# Triggered on every push to main. Builds, tests, publishes images to ECR, then performs a
# rolling deployment across all 3 application EC2 instances via AWS Systems Manager.
#
# Architecture:
#   GitHub → OIDC → ECR push → SSM Run Command → EC2 pull + restart
#
# No SSH keys, no long-lived AWS credentials. Authentication is entirely through GitHub OIDC
# federation, and deployment commands are sent through SSM (which is logged and auditable).
#
# Rolling deploy order: App1 → health → App2 → health → App3 → health → Edge → verify.
# If any node fails health check, it is automatically rolled back to the previous image.
# Subsequent nodes are skipped (the workflow fails).

name: Deploy

on:
  push:
    branches: [main]

# A running deployment must never be interrupted. If a new push arrives while deploying,
# it queues behind the current run rather than cancelling it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  id-token: write   # GitHub OIDC token for AWS authentication
  contents: read

jobs:
  # =========================================================================
  # Stage 1: Build & Test
  # =========================================================================
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        env:
          # Throwaway CI key — HS512 needs 64 decoded bytes. Real deployments inject a
          # secret from their secret store.
          LINKFLOW_JWT_SECRET: LEi1zn2i+yxtsZleAqjkTeiYGy6O7bPesPZdp+SAuc6+nGrKSvpvaBth6R2DRY1ahbiXftdckabnYZeMhtwmIA==
        run: mvn -B clean verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  # =========================================================================
  # Stage 2: Build & Push Images to ECR
  # =========================================================================
  build-and-push:
    name: Build and push images
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: app
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/linkflow-app:${{ steps.meta.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/linkflow-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: gateway
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/linkflow-gateway:${{ steps.meta.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/linkflow-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: web
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ECR_REGISTRY }}/linkflow-web:${{ steps.meta.outputs.tag }}
            ${{ secrets.ECR_REGISTRY }}/linkflow-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # Stage 3: Rolling Deploy — App Node 1
  # =========================================================================
  deploy-app-1:
    name: Deploy App Node 1
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP1_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "::group::Deploying $IMAGE_TAG to App Node 1"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['cd /opt/linkflow && bash ./scripts/deploy.sh ${IMAGE_TAG} 2>&1']" \
            --timeout-seconds 300 \
            --comment "Deploy linkflow ${IMAGE_TAG} to app1" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command: $COMMAND_ID"

          # Poll for completion
          MAX_WAIT=300
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")

            case "$STATUS" in
              Success)
                echo "Deploy succeeded"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "::endgroup::"
                exit 0
                ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut)
                echo "::error::Deploy failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text || true
                echo "--- stderr ---"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' --output text || true
                echo "::endgroup::"
                exit 1
                ;;
              *)
                sleep 15
                ELAPSED=$((ELAPSED + 15))
                ;;
            esac
          done

          echo "::error::SSM command timed out"
          echo "::endgroup::"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP1_INSTANCE_ID }}
        run: |
          echo "::warning::Rolling back App Node 1"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/linkflow && bash ./scripts/rollback.sh 2>&1"]' \
            --timeout-seconds 300 \
            --comment "Rollback linkflow on app1" \
            --query 'Command.CommandId' --output text)

          MAX_WAIT=300
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success) echo "Rollback succeeded"; exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut) echo "::error::Rollback also failed: $STATUS"; exit 1 ;;
              *) sleep 10; ELAPSED=$((ELAPSED + 10)) ;;
            esac
          done
          echo "::error::Rollback timed out"
          exit 1

  # =========================================================================
  # Stage 3: Rolling Deploy — App Node 2
  # =========================================================================
  deploy-app-2:
    name: Deploy App Node 2
    needs: [build-and-push, deploy-app-1]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP2_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "::group::Deploying $IMAGE_TAG to App Node 2"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['cd /opt/linkflow && bash ./scripts/deploy.sh ${IMAGE_TAG} 2>&1']" \
            --timeout-seconds 300 \
            --comment "Deploy linkflow ${IMAGE_TAG} to app2" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command: $COMMAND_ID"

          MAX_WAIT=300
          ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success)
                echo "Deploy succeeded"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                echo "::endgroup::"
                exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut)
                echo "::error::Deploy failed: $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 15; ELAPSED=$((ELAPSED + 15)) ;;
            esac
          done
          echo "::error::SSM command timed out"
          echo "::endgroup::"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP2_INSTANCE_ID }}
        run: |
          echo "::warning::Rolling back App Node 2"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/linkflow && bash ./scripts/rollback.sh 2>&1"]' \
            --timeout-seconds 300 \
            --comment "Rollback linkflow on app2" \
            --query 'Command.CommandId' --output text)
          MAX_WAIT=300; ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success) echo "Rollback succeeded"; exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut) echo "::error::Rollback failed: $STATUS"; exit 1 ;;
              *) sleep 10; ELAPSED=$((ELAPSED + 10)) ;;
            esac
          done
          echo "::error::Rollback timed out"; exit 1

  # =========================================================================
  # Stage 3: Rolling Deploy — App Node 3
  # =========================================================================
  deploy-app-3:
    name: Deploy App Node 3
    needs: [build-and-push, deploy-app-2]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy via SSM
        id: deploy
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP3_INSTANCE_ID }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
        run: |
          echo "::group::Deploying $IMAGE_TAG to App Node 3"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=['cd /opt/linkflow && bash ./scripts/deploy.sh ${IMAGE_TAG} 2>&1']" \
            --timeout-seconds 300 \
            --comment "Deploy linkflow ${IMAGE_TAG} to app3" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command: $COMMAND_ID"

          MAX_WAIT=300; ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success)
                echo "Deploy succeeded"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                echo "::endgroup::"
                exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut)
                echo "::error::Deploy failed: $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 15; ELAPSED=$((ELAPSED + 15)) ;;
            esac
          done
          echo "::error::SSM command timed out"
          echo "::endgroup::"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          INSTANCE_ID: ${{ secrets.EC2_APP3_INSTANCE_ID }}
        run: |
          echo "::warning::Rolling back App Node 3"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/linkflow && bash ./scripts/rollback.sh 2>&1"]' \
            --timeout-seconds 300 \
            --comment "Rollback linkflow on app3" \
            --query 'Command.CommandId' --output text)
          MAX_WAIT=300; ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success) echo "Rollback succeeded"; exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut) echo "::error::Rollback failed: $STATUS"; exit 1 ;;
              *) sleep 10; ELAPSED=$((ELAPSED + 10)) ;;
            esac
          done
          echo "::error::Rollback timed out"; exit 1

  # =========================================================================
  # Stage 4: Update Edge (Nginx/Prometheus config changes)
  # =========================================================================
  deploy-edge:
    name: Update edge
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Update edge via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_EDGE_INSTANCE_ID }}
        run: |
          echo "::group::Updating edge node"

          # Pull latest configs and restart. docker compose up -d only recreates
          # containers whose configuration changed, so this is a no-op when only
          # application images changed.
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /opt/linkflow && git fetch origin 2>&1 && git checkout main 2>&1 && git reset --hard origin/main 2>&1 && docker compose -f docker-compose.ec2-edge.yml up -d --remove-orphans 2>&1"]' \
            --timeout-seconds 120 \
            --comment "Update linkflow edge" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command: $COMMAND_ID"

          MAX_WAIT=120; ELAPSED=0
          while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || echo "InProgress")
            case "$STATUS" in
              Success)
                echo "Edge update succeeded"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                echo "::endgroup::"
                exit 0 ;;
              Failed|TimedOut|Cancelled|DeliveryTimedOut)
                echo "::error::Edge update failed: $STATUS"
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardOutputContent' --output text || true
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'StandardErrorContent' --output text || true
                echo "::endgroup::"
                exit 1 ;;
              *) sleep 10; ELAPSED=$((ELAPSED + 10)) ;;
            esac
          done
          echo "::error::Edge update timed out"
          echo "::endgroup::"
          exit 1

  # =========================================================================
  # Stage 5: Post-deploy Verification
  # =========================================================================
  verify:
    name: Post-deploy verification
    needs: [deploy-app-3, deploy-edge]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify edge health
        env:
          INSTANCE_ID: ${{ secrets.EC2_EDGE_INSTANCE_ID }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["wget -qO- --timeout=5 http://127.0.0.1/nginx-health"]' \
            --timeout-seconds 30 \
            --query 'Command.CommandId' --output text)

          sleep 10
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query 'Status' --output text 2>/dev/null || echo "InProgress")
          if [ "$STATUS" = "Success" ]; then
            echo "✓ Edge: healthy"
          else
            echo "::error::Edge health check failed"
            exit 1
          fi

      - name: Verify app nodes
        env:
          APP1: ${{ secrets.EC2_APP1_INSTANCE_ID }}
          APP2: ${{ secrets.EC2_APP2_INSTANCE_ID }}
          APP3: ${{ secrets.EC2_APP3_INSTANCE_ID }}
        run: |
          FAILED=0
          for PAIR in "app1:$APP1" "app2:$APP2" "app3:$APP3"; do
            NAME="${PAIR%%:*}"
            INSTANCE="${PAIR#*:}"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["cd /opt/linkflow && bash ./scripts/health-check.sh 2>&1"]' \
              --timeout-seconds 30 \
              --query 'Command.CommandId' --output text)

            MAX_WAIT=60; ELAPSED=0
            while [ "$ELAPSED" -lt "$MAX_WAIT" ]; do
              STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --query 'Status' --output text 2>/dev/null || echo "InProgress")
              case "$STATUS" in
                Success) echo "✓ $NAME: all healthy"; break ;;
                Failed|TimedOut|Cancelled|DeliveryTimedOut)
                  echo "::error::✗ $NAME: health check failed"
                  aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE" --query 'StandardOutputContent' --output text || true
                  FAILED=1; break ;;
                *) sleep 5; ELAPSED=$((ELAPSED + 5)) ;;
              esac
            done

            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "::error::✗ $NAME: health check timed out"
              FAILED=1
            fi
          done

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi
          echo ""
          echo "=== All nodes verified healthy ==="

  # =========================================================================
  # Stage 6: Notification (optional)
  # =========================================================================
  notify:
    name: Notify
    needs: [verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send deployment notification
        if: vars.DEPLOY_WEBHOOK_URL != '' || secrets.DEPLOY_WEBHOOK_URL != ''
        env:
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          DEPLOY_STATUS: ${{ needs.verify.result }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || 'unknown' }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "No webhook URL configured, skipping notification"
            exit 0
          fi

          if [ "$DEPLOY_STATUS" = "success" ]; then
            COLOR=3066993   # green
            TITLE="✅ LinkFlow deployed successfully"
          else
            COLOR=15158332  # red
            TITLE="❌ LinkFlow deployment failed"
          fi

          # Discord-compatible webhook payload (also works with many Slack webhooks)
          PAYLOAD=$(cat <<EOF
          {
            "embeds": [{
              "title": "$TITLE",
              "color": $COLOR,
              "fields": [
                {"name": "Image Tag", "value": "\`$IMAGE_TAG\`", "inline": true},
                {"name": "Commit", "value": "\`${COMMIT_SHA:0:7}\`", "inline": true},
                {"name": "Message", "value": "$(echo "$COMMIT_MSG" | head -1 | sed 's/"/\\"/g')"},
                {"name": "Details", "value": "[View run]($RUN_URL)"}
              ]
            }]
          }
          EOF
          )

          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL" || true
