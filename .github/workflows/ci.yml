name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# A new push makes the previous run's result irrelevant, so cancel it rather than paying for both
# and waiting behind the stale one. Never applied to the default branch, where every commit's
# result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

# Least privilege by default. A job that needs more must ask for it explicitly, so a compromised
# action in the dependency tree cannot push commits or publish packages.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # Integration tests start real PostgreSQL and Redis containers through Testcontainers, which is
    # slower than a warm service container but keeps a test's dependencies declared in the test
    # itself. There were `services:` blocks here for both; nothing ever connected to them, because
    # every test provisions its own.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        env:
          # Throwaway CI key. Generated randomly and used only for this build; HS512 needs 64
          # decoded bytes. Real deployments inject a secret from their secret store.
          LINKFLOW_JWT_SECRET: LEi1zn2i+yxtsZleAqjkTeiYGy6O7bPesPZdp+SAuc6+nGrKSvpvaBth6R2DRY1ahbiXftdckabnYZeMhtwmIA==
        run: mvn -B clean verify

      # Surefire and Failsafe XML says which assertion failed and why; the job log alone often does
      # not, especially for a test that failed inside a Testcontainers callback.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # All three targets share one build stage, so this compiles the reactor once. Building the
      # images in CI is what catches a Dockerfile that no longer matches the project — the previous
      # per-service Dockerfiles listed every module by hand and silently broke when one was added,
      # which nothing noticed because nothing built them.
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: app
          # Not pushed anywhere. The point is that it builds; loading it into the daemon would only
          # cost time and disk.
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: gateway
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile
          target: web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  config:
    name: Validate deployment config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Catches interpolation errors and schema mistakes that would otherwise only surface on
      # someone's machine at `docker compose up`.
      - name: Validate Compose file
        run: docker compose config --quiet

      # EC2 compose files use variables that are absent from the dev .env, so they need inline
      # values for the validator. The point is schema correctness, not runtime values.
      - name: Validate EC2 app Compose file
        run: |
          REGISTRY="" IMAGE_TAG=latest REDIS_HOST=x REDIS_PASSWORD=x \
          SPRING_DATASOURCE_URL=x SPRING_DATASOURCE_USERNAME=x SPRING_DATASOURCE_PASSWORD=x \
          LINKFLOW_JWT_SECRET=x LINKFLOW_BASE_URL=x LINKFLOW_CORS_ALLOWED_ORIGINS=x \
          LINKFLOW_MAIL_FROM=x SPRING_MAIL_HOST=x \
          docker compose -f docker-compose.ec2-app.yml config --quiet

      - name: Validate EC2 edge Compose file
        run: |
          APP_NODE_1_IP=10.0.0.1 APP_NODE_2_IP=10.0.0.2 APP_NODE_3_IP=10.0.0.3 \
          REDIS_PASSWORD=x REDIS_BIND_ADDRESS=0.0.0.0 GRAFANA_ADMIN_PASSWORD=x \
          docker compose -f docker-compose.ec2-edge.yml config --quiet

      - name: Generate TLS certificate for validation
        run: ./infrastructure/nginx/generate-dev-certs.sh

      # `nginx -t` parses the real config with the real modules, which no linter approximates.
      # --add-host is required because Nginx resolves upstream names while parsing, and the gateway
      # does not exist outside the Compose network — without it the test fails on DNS, not syntax.
      - name: Validate Nginx config
        run: |
          docker run --rm \
            --add-host linkflow-gateway:127.0.0.1 \
            -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro" \
            -v "$PWD/infrastructure/nginx/certs:/etc/nginx/certs:ro" \
            nginx:1.27-alpine nginx -t

      # Generate temporary self-signed certificates at the exact path expected by the committed
      # EC2 Nginx configuration (/etc/letsencrypt/live/linkflow.slayerbit.me/), then validate with nginx -t.
      - name: Validate EC2 Nginx config
        run: |
          CERT_DOMAIN="linkflow.slayerbit.me"
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/letsencrypt/live/$CERT_DOMAIN"
          openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
            -keyout "$WORK_DIR/letsencrypt/live/$CERT_DOMAIN/privkey.pem" \
            -out "$WORK_DIR/letsencrypt/live/$CERT_DOMAIN/fullchain.pem" \
            -subj "/CN=$CERT_DOMAIN" \
            -addext "subjectAltName=DNS:$CERT_DOMAIN" 2>/dev/null
          docker run --rm \
            --add-host app1:127.0.0.1 --add-host app2:127.0.0.1 --add-host app3:127.0.0.1 \
            -v "$PWD/infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/infrastructure/nginx/linkflow-ec2.conf:/etc/nginx/conf.d/linkflow.conf:ro" \
            -v "$PWD/infrastructure/nginx/conf.d/proxy-headers.inc:/etc/nginx/conf.d/proxy-headers.inc:ro" \
            -v /dev/null:/etc/nginx/conf.d/default.conf:ro \
            -v "$WORK_DIR/letsencrypt:/etc/letsencrypt:ro" \
            nginx:1.27-alpine nginx -t
          rm -rf "$WORK_DIR"

  scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Scans the declared dependencies rather than a built image: it reports the pom coordinate to
      # change, which is what a fix actually requires.
      #
      # Advisory, not blocking. A CVE published in a transitive dependency would otherwise fail
      # every unrelated pull request until someone upstream cuts a release, and a check that fails
      # for reasons the author cannot address is a check people learn to ignore.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
