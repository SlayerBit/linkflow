name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkflow
          POSTGRES_USER: linkflow
          POSTGRES_PASSWORD: linkflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U linkflow -d linkflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        env:
          LINKFLOW_JWT_SECRET: dGVzdC1zZWNyZXQta2V5LWZvci1jaS1taW5pbXVtLTY0LWNoYXJzLWxlbmd0aC1yZXF1aXJlZA==
        run: mvn -B clean verify
